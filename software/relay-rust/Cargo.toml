[package]
name = "relay-rust"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["AI Pendant"]
description = "Rust/WASM port of the AI Pendant Cloudflare relay worker"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps serde_json::Map insertion-ordered (IndexMap) so that
# round-tripped job blobs and hand-built response objects keep JS key order.
# The nRF firmware scans response bodies for the FIRST `"text"` / `"jobId"`,
# so key order is load-bearing.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.5", features = ["d1"] }
worker-macros = "0.8.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"
