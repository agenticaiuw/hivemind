<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive</title>
<style>
  /* ==========================================================================
   * Tokens.
   *
   * Dark, but never pure black on pure white — #0b0f15 / #eaf0f7 keeps the
   * halation off thin type. Every ink level below is >= 4.5:1 on --surface so
   * secondary text is still readable rather than decorative; the old --ink-3
   * (#64768a) measured 3.96:1 and was used for real content.
   * ====================================================================== */
  :root {
    --bg: #0b0f15;
    --surface: #111823;
    --surface-2: #16202e;
    --surface-3: #1b2635;
    --line: #22303f;     /* decorative card edges only */
    --line-2: #31435a;
    --line-i: #5c6b7d;   /* borders that IDENTIFY a control — 3.25:1, clears 1.4.11 */
    --ink: #e6edf3;      /* 15.4:1 — an off-white; #fff on near-black halates */
    --ink-2: #a7b8cb;    /* 8.4:1  */
    --ink-3: #8195ab;    /* 6.0:1  — the floor; nothing dimmer carries meaning */

    /* Status. Hue is never the only channel — every status also carries a glyph
     * and the literal word — but hue still has to survive on its own.
     * The obvious green/red pair does not: #3fb950 vs #ff7b72 collapse to
     * ΔE 7.3 under deuteranopia, i.e. the same tan. This set was picked for
     * worst-case separation across protan/deutan/tritan (every pair that
     * matters stays ≥28) and for lightness separation too — ok L*75.8 vs
     * down L*55.4 means they stay distinct in pure greyscale. Brightening the
     * red back to #ff7b72 would look nicer and reinstate the collision. */
    --ok: #34d399;      --ok-ink: #34d399;   /* 9.0:1  */
    --warn: #f0b72f;    --warn-ink: #f0b72f; /* 9.5:1  */
    --bad: #e5534b;     --bad-ink: #f0665f;  /* dot 4.7:1, text 5.6:1 */
    --unk: #7d8590;     --unk-ink: #9ba4ae;
    --idle: #58a6ff;    --idle-ink: #58a6ff;

    /* Categorical source palette (unchanged — already validated on dark). */
    --src-mac: #4b93e8;
    --src-relay: #e2683a;
    --src-extension: #1fae7e;
    --src-committee: #d99400;
    --src-pendant: #de6293;
    --src-system: #8395a7;

    --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(1100px 520px at 20% -10%, #101a2a 0%, transparent 62%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }
  /* No `overflow-x: hidden` here on purpose. It would paper over a layout that
   * overflows rather than fix it, and it turns <body> into the scroll container,
   * which breaks sticky positioning and scroll-capture. Every grid child below
   * carries min-width:0 instead, which is the actual cure. */
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .mut { color: var(--ink-3); }
  .err { color: var(--bad-ink); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .wrap { max-width: 1560px; margin: 0 auto; padding: 0 18px; }

  /* ---------- 1. top bar: identity + the one-line verdict ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(11,15,21,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .hrow { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; padding: 12px 0; min-width: 0; }
  .wordmark { font-family: var(--mono); font-size: 16px; font-weight: 700; letter-spacing: 0.34em; white-space: nowrap; flex: none; }
  .wordmark .hex { color: var(--src-committee); letter-spacing: 0; }

  /* The verdict is the largest thing on the page on purpose: it is the answer
   * to the only question a person has when they open this. */
  #verdict { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 320px; }
  #verdict .vg { font-size: 17px; line-height: 1; flex: none; }
  #verdict .vt { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  #verdict .vs { font-size: 13px; color: var(--ink-2); }
  #verdict.ok  .vg, #verdict.ok  .vt { color: var(--ok-ink); }
  #verdict.warn .vg, #verdict.warn .vt { color: var(--warn-ink); }
  #verdict.bad .vg, #verdict.bad .vt { color: var(--bad-ink); }

  .hmeta { display: flex; align-items: center; gap: 8px; flex: none; margin-left: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface);
  }
  .pill b { color: var(--ink); font-weight: 600; }
  .pill.bad { border-color: rgba(208,59,59,0.55); color: var(--bad-ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.live { animation: blink 2.4s infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

  /* ---------- 2. attention list: what is wrong and what to do ---------- */
  #attention { margin: 14px 0 0; }
  #attention.empty { display: none; }
  .attList { display: flex; flex-direction: column; gap: 6px; }
  .att {
    display: flex; align-items: flex-start; gap: 10px; min-width: 0;
    border: 1px solid var(--line); border-left: 3px solid var(--unk);
    border-radius: 8px; background: var(--surface); padding: 9px 12px;
  }
  .att.bad  { border-left-color: var(--bad);  background: linear-gradient(90deg, rgba(229,83,75,0.10), transparent 45%), var(--surface); }
  .att.warn { border-left-color: var(--warn); background: linear-gradient(90deg, rgba(240,183,47,0.09), transparent 45%), var(--surface); }
  .att .ag { flex: none; font-size: 13px; line-height: 1.5; }
  .att.bad .ag { color: var(--bad-ink); }
  .att.warn .ag { color: var(--warn-ink); }
  .att .abody { min-width: 0; flex: 1; }
  .att .atitle { font-weight: 600; }
  .att .ahint { color: var(--ink-2); font-size: 13px; }
  .att .adetail { color: var(--ink-3); font-size: 12px; font-family: var(--mono); overflow-wrap: anywhere; margin-top: 2px; }
  .att .ago { flex: none; font-family: var(--mono); font-size: 11px; color: var(--ink-2); border: 1px solid var(--line-i); border-radius: 6px; padding: 3px 9px; }
  .att .ago:hover { background: var(--surface-3); color: var(--ink); }

  /* ---------- section scaffolding ---------- */
  section.block { margin-top: 18px; min-width: 0; }
  .shead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; min-width: 0; }
  .shead h2 { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.22em; color: var(--ink-3); text-transform: uppercase; }
  .shead .hint { font-size: 12px; color: var(--ink-3); }
  .ghost {
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    border: 1px solid var(--line-i); border-radius: 6px; padding: 3px 9px; background: var(--surface);
  }
  .ghost:hover { background: var(--surface-3); color: var(--ink); }
  .ghost[aria-pressed="true"] { color: var(--bg); border-color: var(--accent); background: var(--accent); font-weight: 600; }
  /* Status legend — the cheapest 1.4.1 remedy there is: name every state. */
  .stLegend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 8px; }
  .stLegend span { display: inline-flex; align-items: center; gap: 5px; }

  /* ---------- 3. node cards: activation at a glance ---------- */
  /* Six nodes, so the column count is pinned to divisors of six. auto-fit was
   * giving 5 + 1 and the orphan read as a different kind of thing. */
  #nodeGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 700px)  { #nodeGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1240px) { #nodeGrid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .ncard {
    text-align: left; min-width: 0; position: relative;
    border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
    padding: 10px 12px; transition: border-color .15s, background .15s;
  }
  .ncard:hover { border-color: var(--line-2); background: var(--surface-2); }
  .ncard[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
  .ncard .nrow1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .ncard .nname { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ncard .nstat { margin-left: auto; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; flex: none; }
  .ncard .nbeat { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
  .ncard .nwhy { font-size: 12px; color: var(--ink-3); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ncard.s-up   .nstat { color: var(--ok-ink); }
  .ncard.s-degraded .nstat { color: var(--warn-ink); }
  .ncard.s-down .nstat { color: var(--bad-ink); }
  .ncard.s-unknown .nstat { color: var(--unk-ink); }
  .ncard.s-idle .nstat { color: var(--idle-ink); }
  .ncard .glyph { flex: none; font-size: 12px; line-height: 1; }
  .ncard.hot::after {
    content: ''; position: absolute; top: 9px; right: 9px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 7px var(--accent); animation: blink 1.6s infinite;
  }

  /* ---------- topology (progressive disclosure — a picture, not the answer) --- */
  #topoWrap { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-top: 8px; padding: 6px 0 2px; }
  #topoWrap[hidden] { display: none; }
  /* Follows the viewBox aspect instead of a fixed height, so a narrow window
   * gets a smaller diagram rather than a small diagram in a tall empty box. */
  #graph { width: 100%; height: auto; aspect-ratio: 900 / 458; max-height: 340px; display: block; }
  /* Graph edges carry meaning, so they are held to 1.4.11's 3:1, not to taste. */
  .edge { stroke: var(--line-i); stroke-width: 1.6; fill: none; }
  .edge.fresh { stroke: #7d94ad; }
  .edge.pulse { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 5 9; animation: dashflow .7s linear infinite; filter: drop-shadow(0 0 4px rgba(127,178,255,0.8)); }
  @keyframes dashflow { to { stroke-dashoffset: -28; } }
  .edgeLabel { font-family: var(--mono); font-size: 10px; fill: var(--ink-3); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; }
  .rt-node { cursor: pointer; }
  .rt-node .body { fill: #101a28; stroke-width: 2.4; transition: stroke .4s; }
  .rt-node .halo { opacity: 0; transition: opacity .8s; }
  .rt-node.hot .halo { opacity: .3; }
  .rt-node.sel .body { stroke-width: 3.6; }
  .rt-node .tag { font-family: var(--mono); font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .rt-node .nlabel { font-size: 12.5px; fill: var(--ink-2); text-anchor: middle; }
  .rt-node.sel .nlabel { fill: var(--ink); }
  .rt-node .nst { font-family: var(--mono); font-size: 11px; text-anchor: middle; }
  .ringGuide { fill: none; stroke: #1b2635; stroke-width: 1; stroke-dasharray: 2 6; }

  /* ---------- 4. main: focused node | shared + activity ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1.32fr) minmax(0, 1fr); gap: 14px; align-items: start; margin-top: 18px; padding-bottom: 40px; }
  @media (max-width: 1040px) { main { grid-template-columns: minmax(0, 1fr); } }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; overflow: hidden; }
  .phead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,0.028), transparent); min-width: 0; }
  .phead h2 { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .phead .sub { font-size: 12px; color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .pbody { padding: 4px 14px 12px; min-width: 0; }

  .badge { font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 5px; letter-spacing: 0.06em; white-space: nowrap; flex: none; }
  .b-up       { color: var(--ok-ink);   background: rgba(52,211,153,0.12);  border: 1px solid rgba(52,211,153,0.45); }
  .b-degraded { color: var(--warn-ink); background: rgba(240,183,47,0.12);  border: 1px solid rgba(240,183,47,0.45); }
  .b-down     { color: var(--bad-ink);  background: rgba(229,83,75,0.14);   border: 1px solid rgba(229,83,75,0.55); }
  .b-unknown  { color: var(--unk-ink);  background: rgba(125,133,144,0.16); border: 1px solid rgba(125,133,144,0.5); }
  .b-idle     { color: var(--idle-ink); background: rgba(88,166,255,0.12);  border: 1px solid rgba(88,166,255,0.45); }

  /* collapsible detail sections — closed unless the owner opened them */
  details.sect { border-top: 1px solid var(--line); min-width: 0; }
  details.sect:first-child { border-top: none; }
  details.sect > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px;
    padding: 9px 0; font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 0;
  }
  details.sect > summary::-webkit-details-marker { display: none; }
  details.sect > summary::before {
    content: '›'; font-family: var(--mono); color: var(--ink-3); flex: none;
    transition: transform .15s; display: inline-block; width: 10px; font-size: 15px;
  }
  details.sect[open] > summary::before { transform: rotate(90deg); }
  details.sect > summary:hover { color: var(--ink); }
  details.sect > summary .cnt { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 400; flex: none; }
  details.sect > summary .flag { font-family: var(--mono); font-size: 10.5px; color: var(--bad-ink); flex: none; }
  .sbody { padding: 0 0 12px 19px; min-width: 0; }

  .kv { display: grid; grid-template-columns: minmax(72px, max-content) minmax(0, 1fr); gap: 3px 14px; font-size: 13px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { color: var(--ink-2); overflow-wrap: anywhere; }

  /* feeds */
  .feed { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .frow { display: flex; gap: 9px; align-items: baseline; font-size: 12.5px; padding: 4px 7px; border-radius: 6px; background: rgba(255,255,255,0.016); min-width: 0; }
  .frow:hover { background: rgba(255,255,255,0.05); }
  .frow .age { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: none; width: 46px; text-align: right; }
  .frow .typ { font-family: var(--mono); color: var(--ink); flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .msg { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .frow .ok  { color: var(--ok-ink); font-family: var(--mono); font-size: 10.5px; flex: none; }
  .frow .bad { color: var(--bad-ink); font-family: var(--mono); font-size: 10.5px; flex: none; }
  .jobrow { cursor: pointer; }
  .receipts { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; margin: 2px 0 6px 46px; font-size: 12px; overflow-wrap: anywhere; }
  .more { font-family: var(--mono); font-size: 11px; color: var(--ink-2); padding: 5px 0 0; }
  .more button { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

  /* counts: ranked, top-N, rest behind a click. Never an alphabetical wall. */
  .counts { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
  .cchip { display: inline-flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
  .cchip b { font-family: var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar { display: grid; grid-template-columns: minmax(90px, max-content) minmax(60px, 1fr) max-content; align-items: center; gap: 10px; font-size: 12.5px; padding: 2px 0; min-width: 0; }
  .bar .bn { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .bt { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .bar .bt i { display: block; height: 100%; background: var(--src-mac); border-radius: 3px; }
  .bar .bv { font-family: var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }

  .stagechip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--ink-3); margin: 1px 3px 1px 0; }
  .stagechip.done   { color: var(--ok-ink);   border-color: rgba(52,211,153,0.5); }
  .stagechip.active { color: var(--warn-ink); border-color: rgba(240,183,47,0.55); }
  .stagechip.error  { color: var(--bad-ink);  border-color: rgba(229,83,75,0.6); }

  /* ---------- credentials — the kill switch. Never collapsed away. ---------- */
  .credBox { border: 1px solid rgba(229,83,75,0.45); border-radius: 9px; background: rgba(229,83,75,0.05); padding: 10px 12px; margin: 4px 0 12px; min-width: 0; }
  .credBox > .ch { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 3px; }
  .credBox > .ch h3 { font-size: 13px; font-weight: 650; }
  .credBox > .cw { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  .credrow { display: flex; gap: 9px; align-items: center; font-size: 12.5px; padding: 5px 7px; border-radius: 6px; background: rgba(255,255,255,0.02); flex-wrap: wrap; min-width: 0; }
  .credrow:hover { background: rgba(255,255,255,0.055); }
  .credrow .role { font-family: var(--mono); color: var(--ink); flex: none; min-width: 74px; }
  .credrow .who { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 150px; min-width: 0; }
  .credrow .tid { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: none; }
  .credrow.dead .role, .credrow.dead .who { color: var(--ink-3); text-decoration: line-through; }
  .revoke { font-family: var(--mono); font-size: 11px; color: var(--bad-ink); border: 1px solid var(--bad); border-radius: 6px; padding: 3px 10px; flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .revoke:hover:not(:disabled) { background: rgba(229,83,75,0.22); color: #ffc9c9; }
  .revoke:disabled { color: var(--ink-3); border-color: var(--line); cursor: default; }
  .revoke.arm { color: var(--warn-ink); border-color: var(--warn); background: rgba(240,183,47,0.14); font-weight: 700; }

  /* ---------- shared tiles: abnormal first, the rest behind a click ---------- */
  #sharedGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 8px; }
  .tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0; }
  .tile.bad  { border-color: rgba(229,83,75,0.5); }
  .tile.warn { border-color: rgba(240,183,47,0.45); }
  .tile .tl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 3px; }
  .tile .tv { font-family: var(--mono); font-size: 23px; font-weight: 600; color: var(--ink); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tile .tv small { font-size: 12px; color: var(--ink-2); font-weight: 400; font-family: var(--sans); }
  .tile.bad .tv { color: var(--bad-ink); }
  .tile.warn .tv { color: var(--warn-ink); }
  .tile .ts { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; overflow-wrap: anywhere; }

  /* ---------- activity ---------- */
  #actFilters { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
  #ticker { max-height: 46vh; min-height: 180px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a3a4f transparent; padding-right: 2px; }
  .tick { display: flex; gap: 9px; align-items: baseline; font-size: 12.5px; padding: 3px 7px; border-radius: 6px; border-left: 2px solid transparent; min-width: 0; animation: fadein .45s; }
  .tick:hover { background: rgba(255,255,255,0.04); }
  .tick.bad { border-left-color: var(--bad); background: rgba(229,83,75,0.07); }
  .tick.warn { border-left-color: var(--warn); }
  @keyframes fadein { from { opacity: 0; transform: translateY(-3px); } }
  .tick .tage { font-family: var(--mono); font-size: 11px; color: var(--ink-3); width: 44px; text-align: right; flex: none; }
  .tick .tage.fresh { color: var(--ink); }
  .tick .tsrc { flex: none; display: inline-flex; align-items: center; }
  .tick .ttext { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .tick.bad .ttext { color: var(--bad-ink); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); padding: 8px 0 0; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
</style>
</head>
<body>
  <header>
    <div class="wrap hrow">
      <span class="wordmark"><span class="hex">&#11041;</span> HIVE</span>
      <div id="verdict"><span class="vg">&#183;</span><span class="vt">checking&hellip;</span></div>
      <div class="hmeta">
        <span class="pill" id="srcSummary">feeds &mdash;</span>
        <span class="pill" id="sseChip"><span class="dot live" style="background:var(--unk)"></span>connecting</span>
        <span class="pill num" id="clock">&mdash;</span>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section id="attention" class="empty"><div class="attList" id="attList"></div></section>

    <section class="block">
      <div class="shead">
        <h2>Nodes</h2>
        <span class="hint">click a node to inspect its environment and tool calls</span>
        <span style="flex:1"></span>
        <button class="ghost" id="topoToggle" aria-pressed="false" aria-controls="topoWrap">Show topology</button>
      </div>
      <div id="nodeGrid"></div>
      <div class="stLegend" id="stLegend"></div>
      <div id="topoWrap" hidden><svg id="graph" viewBox="0 0 900 458" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Runtime topology"></svg></div>
    </section>

    <main>
      <div class="col">
        <section class="panel" id="nodePanel">
          <div class="phead" id="nodeHead"><h2>Node</h2></div>
          <div class="pbody" id="nodeBody"><span class="mut">loading&hellip;</span></div>
        </section>
      </div>
      <div class="col">
        <section class="panel">
          <div class="phead"><h2>Shared across nodes</h2><span class="sub" id="sharedSub"></span></div>
          <div class="pbody" style="padding-top:12px">
            <div id="sharedGrid"></div>
            <div class="more"><button id="sharedMore" type="button"></button></div>
          </div>
        </section>
        <section class="panel">
          <div class="phead">
            <h2>Activity</h2>
            <span style="flex:1"></span>
            <div id="actFilters"></div>
          </div>
          <div class="pbody" style="padding-top:8px">
            <div id="ticker"></div>
            <div class="legend" id="legend"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

<script>
'use strict';
// ============================================================ state
const S = {
  meta: {}, src: {},
  nodes: [], edges: [], shared: null,
  events: [], maxSeq: 0,
  committeeAgents: [],
  focused: 'mac', detail: null, detailErr: null,
  clockOffset: 0, sse: 'connecting', dropped: false,
  edgeSeen: {},
  /* A revoke in progress must survive the 8 s detail refresh: an armed button
   * that silently disarms under the operator's cursor is worse than no button,
   * because they will click the disarmed one and believe it worked. */
  credArmed: null, credBusy: new Set(),
  open: {}, filter: 'all', sharedAll: false, topo: false,
  more: {}, graphBuilt: false, hoverDetail: false,
  /* jobId -> rendered receipts HTML. The detail panel re-renders every 8 s, so
   * anything the operator opened has to live in state or it silently closes
   * under them a few seconds after they open it. */
  rcpt: {},
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SRC_COLOR = { mac: 'var(--src-mac)', relay: 'var(--src-relay)', extension: 'var(--src-extension)', committee: 'var(--src-committee)', pendant: 'var(--src-pendant)', system: 'var(--src-system)' };
const ST_COLOR = { up: 'var(--ok)', degraded: 'var(--warn)', down: 'var(--bad)', unknown: 'var(--unk)', idle: 'var(--idle)' };
const ST_WORD  = { up: 'UP', degraded: 'DEGRADED', down: 'DOWN', unknown: 'UNKNOWN', idle: 'IDLE' };
/* Distinct SHAPE per state, not just a recoloured dot — colour alone fails
 * WCAG 1.4.1, and these five are told apart in greyscale. */
const ST_GLYPH = { up: '●', degraded: '▲', down: '✕', unknown: '?', idle: '◇' };

/* Honest next steps: each one names where to look, phrased from the node's own
 * transport. Nothing here invents a diagnosis the data does not support. */
const NODE_HINT = {
  pendant: 'The pendant has not checked in with the relay. Power-cycle it, or check LTE coverage where it is.',
  ios: 'The relay has no live row for the phone. Open the iOS app to re-register it.',
  extension: 'Safari is not polling the Mac agent. Check Safari is running with the extension enabled.',
  mac: 'The Mac agent is not answering on 127.0.0.1:8000. Restart it to bring the hive back.',
  relay: 'The Cloudflare relay is not answering /health. Nothing from the pendant or phone can land until it does.',
  committee: 'No committee cycle recently — the orchestrator may have stopped writing.',
};
const NODE_ORDER = ['mac', 'relay', 'extension', 'pendant', 'ios', 'committee'];

// ============================================================ prefs
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem('hive.prefs') || '{}');
    if (p.focused) S.focused = p.focused;
    if (p.open) S.open = p.open;
    if (p.filter) S.filter = p.filter;
    S.sharedAll = !!p.sharedAll;
    S.topo = !!p.topo;
  } catch { /* first visit, or storage blocked — defaults are fine */ }
  if (!Object.keys(S.open).length) S.open = { env: true, tools: true };
}
function savePrefs() {
  try {
    localStorage.setItem('hive.prefs', JSON.stringify({ focused: S.focused, open: S.open, filter: S.filter, sharedAll: S.sharedAll, topo: S.topo }));
  } catch { /* non-fatal */ }
}

// ============================================================ formatting
function snow() { return Date.now() - S.clockOffset; }
function fmtAge(ms) {
  if (ms == null || !isFinite(ms)) return '—';
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + ' s';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' m';
  const h = Math.floor(m / 60);
  if (h < 48) return h + ' h';
  return Math.floor(h / 24) + ' d';
}
function fmtBytes(n) {
  n = Number(n);
  if (!isFinite(n)) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function tsMs(ts) { return typeof ts === 'number' ? ts : Date.parse(ts); }
function ageSpan(ts, suffix) {
  const ms = tsMs(ts);
  if (!ts || !isFinite(ms)) return '<span class="mut">—</span>';
  return `<span class="num" data-ts="${ms}" data-suffix="${esc(suffix || '')}">${fmtAge(snow() - ms)}${esc(suffix || '')}</span>`;
}
function tickAges() {
  const t = snow();
  document.querySelectorAll('[data-ts]').forEach((el) => {
    const age = t - Number(el.dataset.ts);
    /* The suffix used to be baked into the text and lost on the first tick, so
     * "4 s ago" silently became "4 s". It travels in data-suffix now. */
    el.textContent = fmtAge(age) + (el.dataset.suffix || '');
    el.classList.toggle('fresh', age < 12000);
  });
  $('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
}

/* The ticker used to paste raw request bodies onto the wall:
 *   `... deposited probe_http (6413B) — probe_http:body={"actions":[{"type":...`
 * A person cannot read that and it crowds out the lines they can. The payload
 * is summarised here and the untouched original stays in the row's title. */
function humanize(e) {
  let s = String(e.text || '');
  if (e.kind === 'deposit') {
    const m = /^(\S+) deposited (\S+)(?: \((\d+)B\))?/.exec(s);
    if (m) return `${m[1]} → commons · ${m[2]}${m[3] ? ' · ' + fmtBytes(m[3]) : ''}`;
  }
  s = s.replace(/([=:]\s*)[[{][^]*$/, '$1{…}');            // JSON payload to end of line
  s = s.replace(/\b[A-Za-z0-9+/_~=-]{26,}\b/g, '…');       // hashes, uuids, base64 runs
  return s.replace(/\s+/g, ' ').trim();
}
const BAD_RE = /\bfail(ed|ure|s)?\b|\berror\b|\boffline\b|unreachable|timed? ?out|refused|denied/i;
const WARN_RE = /\bspool(ed)?\b|expired|degraded|retry|retrying|stale/i;
/* Only events that REPORT an operation get the word-sniffing treatment. A
 * committee message whose subject happens to discuss a failure is not itself a
 * failure, and painting it red was making the feed cry wolf. */
const OPERATIONAL = new Set(['job', 'action', 'pipeline', 'routine', 'voice-run', 'spool', 'status']);
function evSeverity(e) {
  if (e.kind === 'source-error') return 'bad';
  if (!OPERATIONAL.has(e.kind)) return '';
  if (BAD_RE.test(e.text)) return 'bad';
  if (WARN_RE.test(e.text)) return 'warn';
  return '';
}

// ============================================================ issues
/* Everything that would make the owner do something, in one list, worst first.
 * If this list is empty the hive is fine and the page says so in one line. */
function computeIssues() {
  const out = [];
  const push = (o) => out.push(o);
  for (const n of S.nodes) {
    if (n.status === 'down') push({ sev: 'bad', node: n.id, title: `${n.label} is down`, hint: NODE_HINT[n.id], detail: n.reason });
    else if (n.status === 'degraded') push({ sev: 'warn', node: n.id, title: `${n.label} is degraded`, hint: NODE_HINT[n.id], detail: n.reason });
    else if (n.status === 'unknown') push({ sev: 'warn', node: n.id, title: `${n.label} status is unknown`, hint: NODE_HINT[n.id], detail: n.reason });
  }
  for (const m of Object.values(S.meta)) {
    if (m && !m.ok && !m.unsupported) push({ sev: 'bad', title: `Feed "${m.label}" is failing`, hint: 'Everything derived from this feed on the page is stale.', detail: m.error });
  }
  const sh = S.shared || {};
  if (sh.fleet && sh.fleet.macBridgeOnline === false) {
    push({ sev: 'bad', node: 'relay', title: 'The relay cannot see the Mac agent', hint: 'Voice from the pendant or phone will not reach the Mac until the bridge reconnects.', detail: sh.fleet.relayErrorFromMac || '' });
  }
  if (sh.routines && sh.routines.failed) {
    push({ sev: 'warn', node: 'mac', title: `${sh.routines.failed} routine${sh.routines.failed > 1 ? 's' : ''} failing`, hint: 'Open the Mac agent and read the routine’s last error.' });
  }
  if (sh.spool && sh.spool.depth) {
    push({ sev: 'warn', node: 'extension', title: `${sh.spool.depth} browser command${sh.spool.depth > 1 ? 's' : ''} spooled`, hint: 'These never reached Safari.', detail: sh.spool.lastReason || '' });
  }
  const jf = sh.jobs && sh.jobs.byStatus && sh.jobs.byStatus.failed;
  if (jf) push({ sev: 'warn', node: 'mac', title: `${jf} of the last ${sh.jobs.returned} jobs failed`, hint: 'Open the Mac agent → Jobs and click one for its receipts.' });
  const rank = { bad: 0, warn: 1 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev]);
}

function renderVerdict(issues) {
  const bad = issues.filter((i) => i.sev === 'bad').length;
  const warn = issues.length - bad;
  const v = $('verdict');
  let cls, glyph, text, sub;
  if (bad) { cls = 'bad'; glyph = ST_GLYPH.down; text = `${bad} thing${bad > 1 ? 's need' : ' needs'} attention`; sub = warn ? `and ${warn} to check` : ''; }
  else if (warn) { cls = 'warn'; glyph = ST_GLYPH.degraded; text = `${warn} thing${warn > 1 ? 's' : ''} to check`; sub = ''; }
  else { cls = 'ok'; glyph = ST_GLYPH.up; text = `All ${S.nodes.length} nodes healthy`; sub = 'nothing needs you'; }
  v.className = cls;
  v.innerHTML = `<span class="vg">${glyph}</span><span class="vt">${esc(text)}</span>${sub ? `<span class="vs">${esc(sub)}</span>` : ''}`;
}

function renderAttention(issues) {
  const box = $('attention');
  box.classList.toggle('empty', issues.length === 0);
  $('attList').innerHTML = issues.map((i) =>
    `<div class="att ${i.sev}"><span class="ag">${i.sev === 'bad' ? ST_GLYPH.down : ST_GLYPH.degraded}</span>` +
    `<div class="abody"><span class="atitle">${esc(i.title)}</span>${i.hint ? ` <span class="ahint">${esc(i.hint)}</span>` : ''}` +
    `${i.detail ? `<div class="adetail">${esc(i.detail)}</div>` : ''}</div>` +
    (i.node ? `<button class="ago" type="button" data-focus="${esc(i.node)}">inspect</button>` : '') + `</div>`
  ).join('');
  $('attList').querySelectorAll('[data-focus]').forEach((b) => b.addEventListener('click', () => {
    focus(b.dataset.focus);
    $('nodePanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
}

// ============================================================ header / nodes
function heartbeatTs(id) {
  if (id === 'mac') return S.meta['agent.health'] && S.meta['agent.health'].ok ? S.meta['agent.health'].at : null;
  if (id === 'relay') return S.meta['relay.health'] && S.meta['relay.health'].ok ? S.meta['relay.health'].at : null;
  if (id === 'extension') { const d = (S.src['agent.browserStatus'] || {}).devices; return d && d[0] ? Date.parse(d[0].lastSeenAt) : null; }
  if (id === 'pendant') {
    const dev = ((S.src['relay.devices'] || {}).devices || []).find((d) => /pendant|wearable|nrf/i.test(`${d.deviceType} ${d.deviceId} ${d.name}`));
    return dev ? Date.parse(dev.lastSeenAt) : null;
  }
  if (id === 'ios') {
    const dev = ((S.src['relay.devices'] || {}).devices || []).find((d) => d.deviceType === 'mobile');
    return dev ? Date.parse(dev.lastSeenAt) : null;
  }
  if (id === 'committee') { const n = nodeById('committee'); return n ? n.activityAt : null; }
  return null;
}

function renderHeader() {
  const keys = Object.keys(S.meta);
  const bad = keys.filter((k) => S.meta[k] && !S.meta[k].ok && !S.meta[k].unsupported);
  const el = $('srcSummary');
  el.className = 'pill' + (bad.length ? ' bad' : '');
  el.innerHTML = `<span class="dot" style="background:${bad.length ? 'var(--bad)' : 'var(--ok)'}"></span>feeds <b>${keys.length - bad.length}/${keys.length}</b>`;
  const col = S.sse === 'live' ? 'var(--ok)' : (S.sse === 'reconnecting' ? 'var(--warn)' : 'var(--unk)');
  $('sseChip').innerHTML = `<span class="dot live" style="background:${col}"></span>${S.sse}`;
}

/* Built once, then mutated in place on every delta.
 *
 * The first cut re-wrote nodeGrid.innerHTML about every two seconds, which
 * quietly broke three things: keyboard focus was destroyed mid-tab, a click
 * landing between a delta and a repaint hit a detached node, and the browser
 * repainted six cards a second for no reason. Live regions have to be edited,
 * not replaced. */
function renderNodes() {
  const t = snow();
  const order = S.nodes.slice().sort((a, b) => NODE_ORDER.indexOf(a.id) - NODE_ORDER.indexOf(b.id));
  const grid = $('nodeGrid');
  if (grid.childElementCount !== order.length) {
    grid.innerHTML = order.map((n) =>
      `<button type="button" class="ncard" data-node="${esc(n.id)}">` +
      `<span class="nrow1"><span class="glyph"></span><span class="nname"></span><span class="nstat"></span></span>` +
      `<span class="nbeat"><span class="blabel"></span><span class="bage num"></span></span><span class="nwhy"></span></button>`).join('');
    grid.querySelectorAll('[data-node]').forEach((b) => b.addEventListener('click', () => focus(b.dataset.node)));
  }
  order.forEach((n, i) => {
    const card = grid.children[i];
    if (!card) return;
    if (card.dataset.node !== n.id) card.dataset.node = n.id;
    const hb = heartbeatTs(n.id);
    const beat = hb ? 'last seen ' + fmtAge(t - hb) + ' ago' : 'no heartbeat';
    card.className = `ncard s-${n.status}${n.activityAt != null && t - n.activityAt < 12000 ? ' hot' : ''}`;
    card.setAttribute('aria-pressed', String(S.focused === n.id));
    /* Visible text is the accessible name; the long reason stays in title. */
    card.setAttribute('aria-label', `${n.label}, ${ST_WORD[n.status] || 'unknown'}, ${beat}`);
    card.title = n.reason || '';
    const g = card.querySelector('.glyph');
    g.style.color = ST_COLOR[n.status] || ST_COLOR.unknown;
    g.textContent = ST_GLYPH[n.status] || '?';
    card.querySelector('.nname').textContent = n.label;
    card.querySelector('.nstat').textContent = ST_WORD[n.status] || '?';
    const bl = card.querySelector('.blabel'), ba = card.querySelector('.bage');
    bl.textContent = hb ? 'last seen ' : 'no heartbeat';
    card.querySelector('.nbeat').classList.toggle('mut', !hb);
    /* Only the age span carries data-ts, so the 1 s tick rewrites the number
     * and leaves the "last seen " label alone. */
    if (hb) { ba.dataset.ts = String(hb); ba.dataset.suffix = ' ago'; ba.textContent = fmtAge(t - hb) + ' ago'; }
    else { delete ba.dataset.ts; ba.textContent = ''; }
    card.querySelector('.nwhy').textContent = n.reason || '';
  });
}

// ============================================================ topology (opt-in)
const RT = { cx: 450, cy: 226, r: 158 };
/* The transport labels are written for prose elsewhere; on a 158 px spoke the
 * full strings are wider than the gap between two circles and get swallowed. */
const EDGE_SHORT = { 'pendant-relay': 'WS + HTTP', 'mac-relay': 'long-poll 5 s', 'ext-mac': 'poll 750 ms', 'ios-relay': 'web shell' };
const RT_ANGLES = { pendant: -90, mac: 15, extension: 90, ios: 195 };
const NODE_TAG = { pendant: 'PND', relay: 'RLY', mac: 'MAC', extension: 'EXT', ios: 'IOS' };
const NODE_NAME = { pendant: 'Pendant', relay: 'Cloud Relay', mac: 'Mac Agent', extension: 'Browser Extension', ios: 'iOS App' };
function polar(r, deg) { const a = deg * Math.PI / 180; return { x: RT.cx + r * Math.cos(a), y: RT.cy + r * Math.sin(a) }; }
function rtPos(id) { return id === 'relay' ? { x: RT.cx, y: RT.cy } : polar(RT.r, RT_ANGLES[id]); }

function buildGraph() {
  const svg = $('graph');
  svg.innerHTML = '';
  const el = (n, attrs, text) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', n);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (text != null) e.textContent = text;
    return e;
  };
  svg.appendChild(el('circle', { cx: RT.cx, cy: RT.cy, r: RT.r, class: 'ringGuide' }));
  const edgeG = el('g', {}); svg.appendChild(edgeG);
  /* Spokes get no perpendicular offset — their midpoint is already open space
   * between two circles, and nudging the label sideways was dropping it on top
   * of a node's caption. Only the extension↔mac chord needs clearing. */
  for (const e of [
    { id: 'pendant-relay', a: 'pendant', b: 'relay', off: 0 },
    { id: 'mac-relay', a: 'mac', b: 'relay', off: 0 },
    { id: 'ext-mac', a: 'extension', b: 'mac', off: 15 },
    { id: 'ios-relay', a: 'ios', b: 'relay', off: 0 },
  ]) {
    const p1 = rtPos(e.a), p2 = rtPos(e.b);
    edgeG.appendChild(el('line', { id: 'edge-' + e.id, class: 'edge', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }));
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
    edgeG.appendChild(el('text', { id: 'edgelabel-' + e.id, class: 'edgeLabel', x: mx - dy / len * e.off, y: my + dx / len * e.off + 4, 'text-anchor': 'middle' }, ''));
  }
  const nodeG = el('g', {}); svg.appendChild(nodeG);
  for (const id of ['pendant', 'relay', 'mac', 'extension', 'ios']) {
    const p = rtPos(id);
    const r = id === 'relay' ? 38 : 31;
    const g = el('g', { id: 'rt-' + id, class: 'rt-node', 'data-node': id, transform: `translate(${p.x},${p.y})`, tabindex: '0', role: 'button' });
    g.appendChild(el('circle', { class: 'halo', r: r + 13, fill: 'var(--unk)', filter: 'blur(6px)' }));
    g.appendChild(el('circle', { class: 'body', r, stroke: 'var(--unk)' }));
    g.appendChild(el('text', { class: 'tag', y: 5 }, NODE_TAG[id]));
    const up = id === 'pendant';
    g.appendChild(el('text', { class: 'nlabel', y: up ? -(r + 24) : r + 20 }, NODE_NAME[id]));
    g.appendChild(el('text', { class: 'nst', id: 'nst-' + id, y: up ? -(r + 9) : r + 35, fill: 'var(--unk)' }, '—'));
    g.appendChild(el('title', {}, NODE_NAME[id]));
    g.addEventListener('click', () => focus(id));
    g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); focus(id); } });
    nodeG.appendChild(g);
  }
  S.graphBuilt = true;
}

function renderGraph() {
  if (!S.graphBuilt) return;
  const t = snow();
  for (const n of S.nodes) {
    const g = $('rt-' + n.id);
    if (!g) continue;
    const col = ST_COLOR[n.status] || ST_COLOR.unknown;
    g.querySelector('.body').setAttribute('stroke', col);
    g.querySelector('.halo').setAttribute('fill', col);
    g.classList.toggle('hot', n.activityAt != null && t - n.activityAt < 12000);
    g.classList.toggle('sel', S.focused === n.id);
    const hb = heartbeatTs(n.id);
    const st = $('nst-' + n.id);
    st.setAttribute('fill', col);
    st.textContent = (ST_WORD[n.status] || '?') + (hb ? ' · ' + fmtAge(t - hb) : '');
    g.querySelector('title').textContent = `${n.label}: ${ST_WORD[n.status]}\n${n.reason || ''}`;
  }
  for (const e of S.edges) {
    const line = $('edge-' + e.id), lbl = $('edgelabel-' + e.id);
    if (!line) continue;
    lbl.textContent = EDGE_SHORT[e.id] || e.label;
    lbl.setAttribute('title', e.label);
    const act = e.lastActivityAt || 0;
    line.classList.toggle('fresh', act && t - act < 30000);
    if (act && act !== S.edgeSeen[e.id]) {
      if (S.edgeSeen[e.id] !== undefined) {
        line.classList.add('pulse');
        clearTimeout(line._pt);
        line._pt = setTimeout(() => line.classList.remove('pulse'), 2600);
      }
      S.edgeSeen[e.id] = act;
    }
  }
}

function setTopo(on) {
  S.topo = on;
  $('topoWrap').hidden = !on;
  const b = $('topoToggle');
  b.setAttribute('aria-pressed', String(on));
  b.textContent = on ? 'Hide topology' : 'Show topology';
  if (on) { if (!S.graphBuilt) buildGraph(); renderGraph(); }
  savePrefs();
}

// ============================================================ shared tiles
function srcFail(key) {
  const m = S.meta[key];
  if (!m) return `<span class="mut">not polled yet</span>`;
  return `<span class="err">${esc(m.label)} failed: ${esc(m.error)}</span>`;
}
function tile(sev, label, valueHtml, subHtml) { return { sev, html: `<div class="tile ${sev}"><div class="tl">${label}</div><div class="tv">${valueHtml}</div><div class="ts">${subHtml || ''}</div></div>` }; }

function renderShared() {
  const sh = S.shared || {};
  const g = [];
  if (sh.fleet && (sh.fleet.macBridgeLastSeenByRelay || sh.fleet.relayReachableFromMac != null)) {
    const f = sh.fleet;
    g.push(tile(f.macBridgeOnline === false ? 'bad' : '', 'Mac &harr; relay link',
      f.macBridgeOnline == null ? '<span class="mut">—</span>' : (f.macBridgeOnline ? 'linked' : 'unlinked'),
      `relay saw mac ${f.macBridgeLastSeenByRelay ? ageSpan(f.macBridgeLastSeenByRelay, ' ago') : '—'} · mac → relay ${f.relayReachableFromMac == null ? '—' : (f.relayReachableFromMac ? 'reachable' : `<span class="err">${esc(f.relayErrorFromMac || 'unreachable')}</span>`)}`));
  } else g.push(tile('bad', 'Mac &harr; relay link', '—', srcFail('relay.health')));

  if (sh.jobs) {
    const f = (sh.jobs.byStatus || {}).failed || 0;
    g.push(tile(f ? 'warn' : '', 'Jobs (last 25)', `${sh.jobs.returned - f}<small> ok</small>`,
      `${f ? `<b style="color:var(--bad-ink)">${f} failed</b> · ` : ''}newest ${sh.jobs.latestAt ? ageSpan(sh.jobs.latestAt, ' ago') : '—'}`));
  } else g.push(tile('bad', 'Jobs (last 25)', '—', srcFail('agent.jobs')));

  if (sh.pipeline) {
    g.push(tile('', 'Voice pipeline', `${sh.pipeline.inFlight}<small> in flight</small>`,
      `${sh.pipeline.totalRuns} runs total · latest ${sh.pipeline.latest ? esc(sh.pipeline.latest.status) + ' ' + ageSpan(sh.pipeline.latest.updatedAt, ' ago') : '—'}`));
  } else g.push(tile('bad', 'Voice pipeline', '—', srcFail('agent.pipeline')));

  if (sh.routines) {
    const nx = sh.routines.next;
    g.push(tile(sh.routines.failed ? 'warn' : '', 'Routines', `${sh.routines.enabled}<small>/${sh.routines.total} on</small>`,
      nx ? `next: ${esc(nx.name)} in <span class="num">${fmtAge(tsMs(nx.nextRunAt) - snow())}</span>${sh.routines.failed ? ` · <span class="err">${sh.routines.failed} failing</span>` : ''}` : '—'));
  } else g.push(tile('bad', 'Routines', '—', srcFail('agent.routines')));

  if (sh.spool) {
    g.push(tile(sh.spool.depth ? 'warn' : '', 'Browser spool', `${sh.spool.depth ?? '—'}<small> lost</small>`,
      `${sh.spool.pendingCommands ?? 0} pending now${sh.spool.lastReason ? ` · ${esc(sh.spool.lastReason)}` : ''}`));
  } else g.push(tile('bad', 'Browser spool', '—', srcFail('agent.browserStatus')));

  if (sh.memory) {
    const kinds = Object.entries(sh.memory.byKind).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${esc(k)} <b>${v}</b>`).join(' · ');
    g.push(tile('', 'Shared memory', `${sh.memory.totalFacts}<small> facts</small>`, kinds + (sh.memory.masked ? ` · ${sh.memory.masked} masked` : '')));
  } else g.push(tile('bad', 'Shared memory', '—', srcFail('agent.memoryFacts')));

  if (sh.commons) {
    g.push(tile('', 'Commons deposits', `${sh.commons.atLeast ? '≥' : ''}${sh.commons.depositsLast10m}<small> /10 min</small>`,
      sh.commons.lastAt ? `last ${ageSpan(sh.commons.lastAt, ' ago')}` : 'no deposits in tail'));
  } else g.push(tile('bad', 'Commons deposits', '—', srcFail('committee.commons')));

  if (sh.ledger) {
    const c = sh.ledger.counts || {};
    g.push(tile('', 'Design ledger', `${c.implemented || 0}<small> implemented</small>`, `${c.proposed || 0} proposed · ${c.implementing || 0} in progress · ${sh.ledger.total} total`));
  } else g.push(tile('bad', 'Design ledger', '—', srcFail('committee.ledger')));

  if (sh.catchup && sh.catchup.counts) {
    const c = sh.catchup.counts;
    g.push(tile(c.failed ? 'warn' : '', 'Catch-up gap', `${c.occurred ?? 0}<small> occurred</small>`,
      `${c.failed ?? 0} failed · ${c.expired ?? 0} expired · window <span class="num">${fmtAge(sh.catchup.spanMs)}</span>`));
  } else g.push(tile('bad', 'Catch-up gap', '—', srcFail('agent.catchup')));

  if (sh.bulletin) {
    g.push(tile('', 'Committee bulletin', `${sh.bulletin.total}<small> msgs</small>`, `round ${sh.bulletin.maxRound} · written ${ageSpan(sh.bulletin.fileMtime, ' ago')}`));
  } else g.push(tile('bad', 'Committee bulletin', '—', srcFail('committee.bulletin')));

  /* Anything abnormal floats to the front; the healthy remainder is one click
   * away, because a number nobody would act on is not worth the first screen. */
  const rank = { bad: 0, warn: 1, '': 2 };
  g.sort((a, b) => rank[a.sev] - rank[b.sev]);
  const HEAD = 4;
  const shown = S.sharedAll ? g : g.slice(0, HEAD);
  $('sharedGrid').innerHTML = shown.map((x) => x.html).join('');
  /* Describes the sort, not a second verdict — the banner is the only verdict. */
  const odd = g.filter((x) => x.sev).length;
  $('sharedSub').textContent = odd ? 'sorted worst first' : 'all steady';
  const btn = $('sharedMore');
  btn.textContent = S.sharedAll ? 'Show less' : `Show all ${g.length}`;
  btn.parentElement.style.display = g.length > HEAD ? '' : 'none';
}

// ============================================================ activity
const FILTERS = [['all', 'All'], ['problems', 'Problems'], ['mac', 'Mac'], ['relay', 'Relay'], ['extension', 'Ext'], ['committee', 'Committee']];
function renderFilters() {
  $('actFilters').innerHTML = FILTERS.map(([k, label]) =>
    `<button type="button" class="ghost" data-f="${k}" aria-pressed="${S.filter === k}">${label}</button>`).join('');
  $('actFilters').querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => {
    S.filter = b.dataset.f; savePrefs(); renderFilters(); renderTicker();
  }));
}
function renderTicker() {
  let list = S.events.slice().sort((a, b) => b.at - a.at);
  if (S.filter === 'problems') list = list.filter((e) => evSeverity(e) === 'bad' || evSeverity(e) === 'warn');
  else if (S.filter !== 'all') list = list.filter((e) => e.source === S.filter);
  list = list.slice(0, 140);
  const box = $('ticker');
  const keep = box.scrollTop;   // a feed that scrolls itself to the top on every delta is unreadable
  box.innerHTML = list.length ? list.map((e) => {
    const c = SRC_COLOR[e.source] || SRC_COLOR.system;
    const sev = evSeverity(e);
    return `<div class="tick ${sev}"><span class="tage num" data-ts="${e.at}" data-suffix="">${fmtAge(snow() - e.at)}</span>` +
      `<span class="tsrc" title="${esc(e.source)}"><span class="dot" style="background:${c}"></span></span>` +
      `<span class="ttext" title="${esc(e.source)} · ${esc(e.text)}">${esc(humanize(e))}</span></div>`;
  }).join('') : `<div class="mut" style="padding:10px 7px">no events match this filter</div>`;
  box.scrollTop = keep;
}
/* Every state named in plain words, once, on the page. Cloudflare's status page
 * does this and it is the cheapest possible remedy for colour-only encoding. */
function renderStatusLegend() {
  $('stLegend').innerHTML = ['up', 'degraded', 'down', 'unknown', 'idle'].map((k) =>
    `<span><span style="color:${ST_COLOR[k]}">${ST_GLYPH[k]}</span>${ST_WORD[k]}</span>`).join('') +
    `<span style="color:var(--accent)">● pulsing dot = active in the last 12 s</span>`;
}
function renderLegend() {
  $('legend').innerHTML = Object.keys(SRC_COLOR).map((k) =>
    `<span><span class="dot" style="background:${SRC_COLOR[k]}"></span>${k}</span>`).join('') +
  `<span style="color:var(--bad-ink)">red bar = failure</span>`;
}

// ============================================================ node detail
function nodeById(id) { return S.nodes.find((n) => n.id === id); }
function metaLine(m) {
  if (!m) return '<span class="mut">not polled yet</span>';
  if (!m.ok) return `<span class="err">${esc(m.error)}</span>`;
  return `<span class="mut">polled ${ageSpan(m.at, ' ago')} · ${m.ms} ms</span>`;
}
/* One collapsible section. `count` rides on the summary so a closed section
 * still answers "is there anything in here", and `flag` marks the ones that
 * are worth opening. */
function sect(id, title, bodyHtml, opts) {
  const o = opts || {};
  const open = S.open[id] === undefined ? !!o.defaultOpen : !!S.open[id];
  return `<details class="sect" data-sec="${esc(id)}"${open ? ' open' : ''}><summary>${esc(title)}` +
    (o.flag ? `<span class="flag">${esc(o.flag)}</span>` : '') +
    (o.count != null ? `<span class="cnt">${esc(String(o.count))}</span>` : '') +
    `</summary><div class="sbody">${bodyHtml}</div></details>`;
}
/* `words` exists because a device that is simply not connected was being
 * labelled FAIL, which reads as "this broke" when it means "this is asleep". */
function feedRow(age, typ, okFlag, msg, words) {
  const w = words || ['ok', 'FAIL'];
  return `<div class="frow">${age}<span class="typ" title="${esc(typ)}">${esc(typ)}</span>` +
    (okFlag == null ? '' : (okFlag ? `<span class="ok">${esc(w[0])}</span>` : `<span class="bad">${esc(w[1])}</span>`)) +
    `<span class="msg" title="${esc(msg)}">${esc(msg)}</span></div>`;
}
const ONLINE = ['online', 'offline'];
function frowAge(ts) { const ms = tsMs(ts); return `<span class="age num" ${isFinite(ms) ? `data-ts="${ms}" data-suffix=""` : ''}>${isFinite(ms) ? fmtAge(snow() - ms) : '—'}</span>`; }
/* Feeds render a slice; the summary always states the true total so a cut list
 * never reads as the whole truth. */
function feedList(id, rows, limit) {
  const cap = S.more[id] ? rows.length : limit;
  let h = `<div class="feed">` + rows.slice(0, cap).join('') + `</div>`;
  if (rows.length > limit) h += `<div class="more">showing ${Math.min(cap, rows.length)} of ${rows.length} <button type="button" data-more="${esc(id)}">${S.more[id] ? 'show fewer' : 'show all'}</button></div>`;
  return h;
}
function stageStrip(run) {
  const CANON = ['transcription', 'command', 'agent', 'tts', 'relay_result', 'device_downlink', 'reply_downloaded', 'device_playback'];
  const byStage = {};
  for (const ev of run.events || []) byStage[ev.stage] = ev.status;
  const extras = Object.keys(byStage).filter((s) => !CANON.includes(s));
  return CANON.concat(extras).map((s) => {
    const st = byStage[s];
    const cls = st == null ? '' : (/done|completed|success/i.test(st) ? 'done' : (/error|fail/i.test(st) ? 'error' : 'active'));
    return `<span class="stagechip ${cls}" title="${esc(s)}${st ? ': ' + esc(st) : ' (not reached)'}">${esc(s)}</span>`;
  }).join('');
}

function renderDetail() {
  const id = S.focused;
  const n = nodeById(id);
  const label = n ? n.label : id;
  $('nodeHead').innerHTML = `<h2>${esc(label)}</h2>` +
    (n ? `<span class="badge b-${esc(n.status)}">${ST_GLYPH[n.status] || '?'} ${ST_WORD[n.status] || '?'}</span>` : '') +
    `<span class="sub" title="${esc((n && n.reason) || '')}">${esc((n && n.reason) || 'design-committee agent')}</span>`;
  const body = $('nodeBody');
  const keepScroll = window.scrollY;
  if (S.detailErr) { body.innerHTML = `<div class="err" style="padding:10px 0">detail fetch failed: ${esc(S.detailErr)}</div>`; return; }
  const d = S.detail;
  if (!d || d.id !== id) { body.innerHTML = '<div class="mut" style="padding:10px 0">loading&hellip;</div>'; return; }
  let h = '';
  if (id === 'mac') h = detailMac(d);
  else if (id === 'relay') h = detailRelay(d);
  else if (id === 'extension') h = detailExtension(d);
  else if (id === 'pendant') h = detailPendant(d);
  else if (id === 'ios') h = detailIos(d);
  else if (id === 'committee') h = detailCommittee(d);
  else h = detailAgent(d);
  body.innerHTML = h;
  window.scrollTo({ top: keepScroll });

  body.querySelectorAll('details[data-sec]').forEach((el) => el.addEventListener('toggle', () => {
    S.open[el.dataset.sec] = el.open; savePrefs();
  }));
  body.querySelectorAll('[data-more]').forEach((b) => b.addEventListener('click', () => {
    S.more[b.dataset.more] = !S.more[b.dataset.more]; renderDetail();
  }));
  body.querySelectorAll('.jobrow').forEach((row) => row.addEventListener('click', () => toggleReceipts(row)));
  body.querySelectorAll('.revoke[data-token]').forEach((btn) => {
    btn.addEventListener('click', () => revokeCredential(btn));
    /* A re-render must not disarm a button the operator already armed, nor
     * offer a second click on one that is mid-flight. */
    if (S.credArmed === btn.dataset.token) armRevoke(btn);
    if (S.credBusy.has(btn.dataset.token)) { btn.disabled = true; btn.textContent = 'revoking…'; }
  });
}

// ---------- mac ----------
function detailMac(d) {
  const s = d.snapshot, o = d.observe, c = d.capabilities, j = d.journal;
  let h = '';

  let env = '';
  if (s) {
    env = `<dl class="kv">
      <dt>machine</dt><dd>${esc(s.machine && s.machine.hostname)} · ${esc(s.machine && s.machine.platform)} · ${(s.machine && s.machine.appCount) ?? '—'} apps · ${esc(s.machine && s.machine.timezone)}</dd>
      <dt>agent</dt><dd>v${esc(s.agent && s.agent.version)} · full control ${s.agent && s.agent.fullControlMode ? 'on' : 'off'} · LLM planner ${s.agent && s.agent.llmPlannerEnabled ? 'on' : 'off'} · computer-use ${s.agent && s.agent.computerUse && s.agent.computerUse.loopEnabled ? `on (max ${s.agent.computerUse.maxSteps} steps)` : 'off'}</dd>
      <dt>foreground</dt><dd>${o && o.foreground ? esc(o.foreground.name) + ' <span class="mut">(' + esc(o.foreground.bundleId) + ')</span>' : metaLine(d.observeMeta)}${o && o.runningApps ? ' · ' + o.runningApps.count + ' apps, ' + o.runningApps.helperProcesses + ' helpers' : ''}</dd>
      <dt>project</dt><dd>${s.workingProject ? esc(s.workingProject.name) + ' — ' + esc(s.workingProject.summary) : '—'}</dd>
    </dl>`;
    if (s.counts) {
      env += `<div class="counts" style="margin-top:8px">` + Object.entries(s.counts).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `<span class="cchip">${esc(k)} <b>${v}</b></span>`).join('') + `</div>`;
    }
  } else env = metaLine(d.snapshotMeta);
  h += sect('env', 'Environment', env, { defaultOpen: true });

  // Tool calls
  let tools = '';
  if (j) {
    const rows = [];
    for (const e of j.entries || []) for (const a of e.actions || []) rows.push({ at: a.finishedAt || a.startedAt || e.finishedAt, a, e });
    rows.sort((x, y) => (Date.parse(y.at) || 0) - (Date.parse(x.at) || 0));
    const html = rows.map(({ at, a, e }) => feedRow(frowAge(at), a.type, a.ok,
      `${a.effect || ''}${a.durationMs != null ? ' · ' + a.durationMs + 'ms' : ''}${a.message ? ' · ' + a.message : ''}${a.error ? ' · ' + a.error : ''}${e.command ? ' — ' + e.command : ''}`));
    tools = `<div class="mut" style="margin-bottom:6px;font-size:12px">${j.totals ? `${j.totals.actions} actions · ${j.totals.wrote} wrote · ${j.totals.failed} failed` : '—'} over ${j.window ? `${j.window.returned} of ${j.window.jobsInStore} jobs` : ''} · ${metaLine(d.journalMeta)}</div>` +
      (rows.length ? feedList('mac.tools', html, 12) : '<span class="mut">journal returned no actions</span>');
  } else tools = metaLine(d.journalMeta);
  h += sect('tools', 'Tool calls', tools, { defaultOpen: true, count: j && j.totals ? j.totals.actions + ' actions' : '', flag: j && j.totals && j.totals.failed ? j.totals.failed + ' failed' : '' });

  // Jobs
  let jobs = '';
  if (d.jobs) {
    const list = d.jobs.jobs || [];
    const rows = list.map((jb) =>
      `<div class="frow jobrow" data-job="${esc(jb.jobId)}">${frowAge(jb.updatedAt || jb.createdAt)}<span class="typ">${esc(jb.type)}</span>` +
      `<span class="${/fail|error/i.test(jb.status) ? 'bad' : 'ok'}">${esc(jb.status)}</span>` +
      `<span class="msg" title="${esc(jb.command)}">${esc(jb.command || '(no command)')}${jb.actionCount != null ? ` · ${jb.actionCount} action(s)` : ''}${jb.error ? ' · ' + esc(jb.error) : ''}</span></div>` +
      `<div class="receipts" id="rcpt-${esc(jb.jobId)}" style="display:${S.rcpt[jb.jobId] ? 'block' : 'none'}">${S.rcpt[jb.jobId] || ''}</div>`);
    const failed = list.filter((x) => /fail|error/i.test(x.status)).length;
    jobs = `<div class="mut" style="margin-bottom:5px;font-size:12px">click a job for its receipts</div>` + feedList('mac.jobs', rows, 8);
    h += sect('jobs', 'Jobs', jobs, { count: list.length, flag: failed ? failed + ' failed' : '' });
  } else h += sect('jobs', 'Jobs', metaLine(d.jobsMeta), {});

  // Routines
  if (d.routines) {
    const rs = d.routines.routines || [];
    const rows = rs.map((r) => feedRow(frowAge(r.lastRunAt), r.name, r.lastStatus ? !/fail/i.test(r.lastStatus) : null,
      `${r.schedule ? esc(r.schedule.kind + ' ' + (r.schedule.at || '')) : ''} · next in ${r.nextRunAt ? fmtAge(tsMs(r.nextRunAt) - snow()) : '—'} · ${r.runCount} runs${r.lastError ? ' · ' + r.lastError : ''}`));
    h += sect('routines', 'Routines', feedList('mac.routines', rows, 8), { count: rs.length });
  } else h += sect('routines', 'Routines', metaLine(d.routinesMeta), {});

  // Memory
  if (d.facts) {
    const fs = d.facts.facts || [];
    let m = `<div class="counts" style="margin-bottom:7px">` + Object.entries(d.facts.byKind || {}).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `<span class="cchip">${esc(k)} <b>${v}</b></span>`).join('') + `</div>`;
    m += feedList('mac.facts', fs.map((f) => feedRow(frowAge(f.updatedAt), f.key, null,
      `${f.masked ? '•••••• (masked)' : f.value} · ${f.kind} · confidence ${f.confidence} · used ${f.useCount}×`)), 8);
    h += sect('facts', 'Memory facts', m, { count: fs.length });
  } else h += sect('facts', 'Memory facts', metaLine(d.factsMeta), {});

  // Capabilities — ranked bars, not an alphabetical chip wall.
  if (d.capabilities) {
    const groups = (d.capabilities.groups || []).slice().sort((a, b) => b.routeCount - a.routeCount);
    const max = groups.length ? groups[0].routeCount : 1;
    const bars = groups.map((g) =>
      `<div class="bar" title="${esc(g.what || '')}"><span class="bn">${esc(g.group)}</span>` +
      `<span class="bt"><i style="width:${Math.max(3, Math.round(g.routeCount / max * 100))}%"></i></span>` +
      `<span class="bv">${g.routeCount}</span></div>`);
    const cap = S.more['mac.caps'] ? bars.length : 6;
    let cb = `<div class="mut" style="margin-bottom:7px;font-size:12px"><b class="num" style="color:var(--ink)">${c.routeCount}</b> routes and <b class="num" style="color:var(--ink)">${c.actionCount}</b> actions across ${groups.length} groups, biggest first.</div>`;
    cb += bars.slice(0, cap).join('');
    if (bars.length > 6) cb += `<div class="more">${S.more['mac.caps'] ? '' : `${bars.length - 6} smaller groups hidden `}<button type="button" data-more="mac.caps">${S.more['mac.caps'] ? 'show fewer' : 'show all'}</button></div>`;
    h += sect('caps', 'Capabilities', cb, { count: `${c.routeCount} routes` });
  } else h += sect('caps', 'Capabilities', metaLine(d.capabilitiesMeta), {});
  return h;
}

/*
 * The credential inventory, with the kill switch on every row.
 *
 * A `mobile` credential carries mac:execute. That was kept on purpose — a phone
 * brain that cannot act is useless. Revocation is still one action from the wall
 * the owner already looks at: two clicks, the first arming the button and naming
 * what is about to be killed, the second doing it. Nothing here holds the admin
 * key — the page names a tokenId and the local server, which already has the
 * key, makes the call.
 *
 * This block is deliberately NOT a collapsible section like everything else on
 * the panel. It is the only way to withdraw a capability from a device that has
 * gone missing, and a kill switch behind a disclosure triangle is a kill switch
 * nobody finds at the moment they need it.
 *
 * Scopes are computed from live role policy at every request, so editing
 * DEVICE_SCOPES withdraws from every un-narrowed credential immediately, no
 * re-pair. The count below is therefore what the credential can do NOW, not what
 * it was handed when it was paired. A row marked `narrowed` is the exception: it
 * was minted with an explicit ceiling, so policy can only intersect it downward
 * and a widening will never reach it. Revocation remains the only answer for a
 * lost device.
 */
function credentialSection(d, opts) {
  const o = opts || {};
  const title = o.title || 'Who can act as this hive';
  const warn = o.warn || 'Every row below holds a live credential for the relay. Revoke one to cut that device off immediately.';
  let h = `<div class="credBox"><div class="ch"><h3>${esc(title)}</h3></div><div class="cw">${esc(warn)}</div>`;
  if (!d.credentials) {
    return h + (d.credentialsMeta && d.credentialsMeta.unsupported
      ? '<span class="mut">credential inventory not available on this relay build (HTTP 404)</span>'
      : metaLine(d.credentialsMeta)) + `</div>`;
  }
  const c = d.credentials;
  const rows = c.credentials || [];
  h += `<div class="counts" style="margin-bottom:7px"><span class="cchip"><b>${c.active}</b> active</span><span class="cchip"><b>${c.revoked}</b> revoked</span>` +
    Object.entries(c.byRole || {}).map(([role, n]) => `<span class="cchip">${esc(role)} <b>${n}</b></span>`).join('') + `</div>`;
  if (!rows.length) return h + '<span class="mut">no device credentials — every client is still on the admin key</span></div>';
  h += `<div class="feed">` + rows.map((r) => {
    const dead = !!r.revokedAt;
    return `<div class="credrow${dead ? ' dead' : ''}">` +
      `<span class="role">${esc(r.role)}</span>` +
      `<span class="who" title="${esc(r.deviceId)}">${esc(r.deviceId)} · ${r.scopeCount} scope(s)${r.narrowed ? ' · <b title="minted with an explicit scope ceiling: a scope added to this role will never reach it">narrowed</b>' : ''}${r.lastUsedAt ? '' : ' · never used'}</span>` +
      (r.lastUsedAt ? `<span class="tid">${ageSpan(r.lastUsedAt, ' ago')}</span>` : '') +
      `<span class="tid">${esc(r.tokenId)}</span>` +
      (dead ? `<button class="revoke" disabled>revoked</button>`
            : `<button class="revoke" data-token="${esc(r.tokenId)}" data-device="${esc(r.deviceId)}" data-role="${esc(r.role)}">revoke</button>`) +
      `</div>`;
  }).join('') + `</div>`;
  return h + `</div>`;
}

function armRevoke(button) {
  S.credArmed = button.dataset.token;
  button.classList.add('arm');
  button.textContent = `kill ${button.dataset.role} ${button.dataset.device}?`;
}

async function revokeCredential(button) {
  /* Two clicks, not a confirm() dialog: the armed state names the device on the
   * button itself, so the thing being killed is visible at the moment of the
   * decision rather than in a modal that reads "are you sure". */
  const token = button.dataset.token;
  if (S.credArmed !== token) {
    armRevoke(button);
    setTimeout(() => {
      if (S.credArmed !== token) return;
      S.credArmed = null;
      renderDetail();
    }, 6000);
    return;
  }
  S.credArmed = null;
  S.credBusy.add(token);
  button.disabled = true;
  button.classList.remove('arm');
  button.textContent = 'revoking…';
  try {
    const r = await fetch('/api/credentials/' + encodeURIComponent(token) + '/revoke', { method: 'POST' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || `HTTP ${r.status}`);
    button.textContent = j.alreadyRevoked ? 'was revoked' : 'revoked';
    const row = button.closest('.credrow');
    if (row) row.classList.add('dead');
    S.credBusy.delete(token);
    fetchDetail();
  } catch (e) {
    S.credBusy.delete(token);
    button.disabled = false;
    button.textContent = 'revoke failed';
    button.title = e.message;
  }
}

// ---------- relay ----------
function detailRelay(d) {
  let h = '';
  let env;
  if (d.health) {
    const he = d.health;
    env = `<dl class="kv">
      <dt>service</dt><dd>${esc(he.service)} v${esc(he.version)} · ${esc(he.platform)} · store ${esc(he.store)}</dd>
      <dt>mac bridge</dt><dd>${he.macBridgeOnline ? 'online' : '<span class="err">offline</span>'} · last seen ${ageSpan(he.macBridgeLastSeen, ' ago')}</dd>
      <dt>models</dt><dd>${he.models ? Object.entries(he.models).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(' · ') : '—'}</dd>
      <dt>features</dt><dd>${he.capabilities ? Object.entries(he.capabilities).filter(([, v]) => v).map(([k]) => esc(k)).join(' · ') : '—'}</dd>
    </dl>`;
  } else env = metaLine(d.healthMeta);
  h += sect('env', 'Environment', env, { defaultOpen: true });
  h += credentialSection(d);

  if (d.devices) {
    const devs = d.devices.devices || [];
    const rows = devs.map((dev) => feedRow(frowAge(dev.lastSeenAt), dev.deviceType, dev.online, `${dev.name} (${dev.deviceId})`, ONLINE));
    const off = devs.filter((x) => !x.online).length;
    h += sect('devices', 'Paired devices', feedList('relay.devices', rows, 8), { count: `${devs.length - off}/${devs.length} online`, defaultOpen: true });
  } else h += sect('devices', 'Paired devices', d.devicesMeta && d.devicesMeta.unsupported ? '<span class="mut">devices endpoint not available on this relay build (HTTP 404)</span>' : metaLine(d.devicesMeta), {});

  if (d.ops) {
    const rows = (d.ops.entries || []).map((e) => feedRow(frowAge(e.updatedAt || e.createdAt), e.kind, !/fail|error/i.test(e.status),
      `${e.status} (job ${e.jobStatus}) · ${e.origin}/${e.inputMode} · ${e.command || e.reply || '(no transcript)'}${e.error ? ' · ' + e.error : ''}${e.actionCount ? ` · ${e.actionCount} action(s)` : ''}`));
    h += sect('tools', 'Tool calls — voice runs', feedList('relay.ops', rows, 10), { defaultOpen: true, count: (d.ops.entries || []).length });
  } else h += sect('tools', 'Tool calls — voice runs', d.opsMeta && d.opsMeta.unsupported ? '<span class="mut">ops history endpoint not available (HTTP 404)</span>' : metaLine(d.opsMeta), {});
  return h;
}

// ---------- extension ----------
function detailExtension(d) {
  let h = '';
  let env;
  if (d.status) {
    env = `<dl class="kv"><dt>online</dt><dd>${d.status.online ? 'yes' : '<span class="err">no</span>'} · ${d.status.pendingCommands} pending command(s)</dd>` +
      (d.status.devices || []).map((dev) => `<dt>device</dt><dd>${esc(dev.deviceName)} · extension v${esc(dev.extensionVersion)} · last poll ${ageSpan(dev.lastSeenAt, ' ago')} · ${dev.tabCount} tab(s)</dd>`).join('') + `</dl>`;
  } else env = metaLine(d.statusMeta);
  h += sect('env', 'Environment', env, { defaultOpen: true });

  const bj = (d.browserJobs || []).map((j) => feedRow(frowAge(j.updatedAt || j.createdAt), j.type, !/fail|error/i.test(j.status), `${j.status} · ${j.command || ''}`));
  h += sect('tools', 'Tool calls — browser jobs', bj.length ? feedList('ext.jobs', bj, 10) : '<span class="mut">no browser-typed jobs in the last 25</span>', { defaultOpen: true, count: bj.length });

  if (d.sessions) {
    const rows = (d.sessions.sessions || []).map((s) => feedRow(frowAge(s.lastUsedAt), s.id, null, `${s.lastAction || ''} · ${s.title || s.url || ''}`));
    h += sect('sessions', 'Named sessions', feedList('ext.sessions', rows, 8), { count: (d.sessions.sessions || []).length });
  } else h += sect('sessions', 'Named sessions', metaLine(d.sessionsMeta), {});

  if (d.spool) {
    const rows = (d.spool.entries || []).map((e) => feedRow(frowAge(e.spooledAt), e.type || 'command', false, `${e.reason} · ${e.detail || ''} · ${e.attempts} attempt(s)`));
    h += sect('spool', 'Spool — commands that never landed', feedList('ext.spool', rows, 8), { count: d.spool.total, flag: d.spool.total ? 'lost' : '' });
  } else h += sect('spool', 'Spool — commands that never landed', metaLine(d.spoolMeta), {});
  return h;
}

// ---------- pendant ----------
function detailPendant(d) {
  let h = '';
  let env;
  if (d.devices) {
    const rows = d.devices.devices || [];
    env = rows.length ? `<div class="feed">` + rows.map((dev) => feedRow(frowAge(dev.lastSeenAt), dev.deviceType, dev.online, `${dev.name} (${dev.deviceId})`, ONLINE)).join('') + `</div>`
      : '<span class="mut">no pendant-class device registered on the relay — status is honestly unknown, not assumed down</span>';
  } else env = metaLine(d.devicesMeta);
  h += sect('env', 'Environment — device row via relay', env, { defaultOpen: true });

  if (d.voiceRuns) {
    const rows = d.voiceRuns.map((e) => feedRow(frowAge(e.updatedAt || e.createdAt), e.origin, !/fail|error/i.test(e.status), `${e.status} · ${e.command || e.reply || '(no transcript)'}${e.audioAvailable ? ' · audio saved' : ''}`));
    h += sect('tools', 'Tool calls — voice runs from the device', rows.length ? feedList('pnd.runs', rows, 10) : '<span class="mut">no device-origin runs in recent ops history</span>', { defaultOpen: true, count: rows.length });
  } else h += sect('tools', 'Tool calls — voice runs from the device', metaLine(d.opsMeta), {});

  if (d.latestPipeline) {
    const body = (d.latestPipeline || []).map((run) =>
      `<div style="margin-bottom:9px"><div style="display:flex;gap:9px;align-items:baseline;min-width:0">${frowAge(run.updatedAt || run.createdAt)}<span class="num" style="flex:none">${esc(run.status)}</span><span class="msg" style="color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(run.command)}">${esc(run.command || run.kind)}</span></div><div>${stageStrip(run)}</div></div>`
    ).join('') || '<span class="mut">no pipeline runs</span>';
    h += sect('trace', 'Utterance trace — pipeline stages', body, { count: (d.latestPipeline || []).length });
  } else h += sect('trace', 'Utterance trace — pipeline stages', metaLine(d.pipelineMeta), {});
  return h;
}

// ---------- ios ----------
function detailIos(d) {
  let h = sect('env', 'Environment', `<dl class="kv"><dt>architecture</dt><dd>${esc(d.note)}</dd></dl>`, { defaultOpen: true });
  /* The phone is the most-stolen node and the one holding mac:execute, so its
   * kill switch is on its own panel as well as on the relay's. */
  h += credentialSection(d, { title: 'This phone’s credentials', warn: 'If the phone is lost, revoke here — this is what stops it acting as you.' });
  if (d.mobileDevices) {
    const rows = d.mobileDevices.map((dev) => feedRow(frowAge(dev.lastSeenAt), 'mobile', dev.online, `${dev.name} (${dev.deviceId})`, ONLINE));
    h += sect('devices', 'Mobile device rows via relay', rows.length ? feedList('ios.dev', rows, 8) : '<span class="mut">relay reports no mobile devices</span>', { defaultOpen: true, count: d.mobileDevices.length });
  } else h += sect('devices', 'Mobile device rows via relay', metaLine(d.devicesMeta), {});
  return h;
}

// ---------- committee ----------
function detailCommittee(d) {
  let h = '';
  if (d.orchestrator) {
    const rows = Object.entries(d.orchestrator.agents).map(([name, a]) =>
      `<div class="frow jump" data-agent="${esc(name)}" style="cursor:pointer">${frowAge(a.lastRunAt)}<span class="typ">${esc(name)}</span><span class="msg">cycle ${a.lastCycle ?? '—'} · ${a.seenCount} commons keys seen</span></div>`);
    h += sect('env', 'Agents — click one to open it', `<div class="feed">${rows.join('')}</div>`, { defaultOpen: true, count: rows.length });
  } else h += sect('env', 'Agents', metaLine(d.orchestratorMeta), {});

  if (d.commons) {
    const rows = (d.commons.tail || []).map((c) => feedRow(frowAge(c.at), c.tool, !c.absent, `${c.agent} r${c.round} · ${c.key} · ${fmtBytes(c.bytes)}`));
    h += sect('tools', 'Tool calls — commons deposits', feedList('cm.commons', rows, 12), { defaultOpen: true, count: rows.length });
  } else h += sect('tools', 'Tool calls — commons deposits', metaLine(d.commonsMeta), {});

  if (d.bulletin) {
    const rows = (d.bulletin.recent || []).slice().reverse().map((m) => feedRow(`<span class="age num">r${m.round}</span>`, `${m.from}→${m.to}`, null, `${m.subject}: ${m.body}`));
    h += sect('bulletin', 'Messages between agents', feedList('cm.bulletin', rows, 10), { count: rows.length });
  } else h += sect('bulletin', 'Messages between agents', metaLine(d.bulletinMeta), {});

  if (d.ledger) {
    const counts = Object.entries(d.ledger.counts).sort((a, b) => b[1] - a[1]);
    const max = counts.length ? counts[0][1] : 1;
    h += sect('ledger', 'Design ledger', counts.map(([k, v]) =>
      `<div class="bar"><span class="bn">${esc(k)}</span><span class="bt"><i style="width:${Math.max(3, Math.round(v / max * 100))}%;background:var(--src-committee)"></i></span><span class="bv">${v}</span></div>`).join(''),
      { count: d.ledger.total });
  } else h += sect('ledger', 'Design ledger', metaLine(d.ledgerMeta), {});
  return h;
}

function detailAgent(d) {
  let h = sect('env', 'Environment', d.orchestrator
    ? `<dl class="kv"><dt>last run</dt><dd>${ageSpan(d.orchestrator.lastRunAt, ' ago')} (cycle ${d.orchestrator.lastCycle ?? '—'})</dd><dt>commons keys</dt><dd>${d.orchestrator.seenCount} seen</dd></dl>`
    : '<span class="mut">no orchestrator record</span>', { defaultOpen: true });
  const dep = (d.deposits || []).map((c) => feedRow(frowAge(c.at), c.tool, !c.absent, `r${c.round} · ${c.key} · ${c.summary || ''}`));
  h += sect('tools', 'Tool calls — deposits by this agent', dep.length ? feedList('ag.dep', dep, 10) : '<span class="mut">none in the current tail</span>', { defaultOpen: true, count: dep.length });
  const msg = (d.messages || []).map((m) => feedRow(`<span class="age num">r${m.round}</span>`, `${m.from}→${m.to}`, null, `${m.subject}: ${m.body}`));
  h += sect('bulletin', 'Messages involving this agent', msg.length ? feedList('ag.msg', msg, 10) : '<span class="mut">none in the recent window</span>', { count: msg.length });
  return h;
}

function paintReceipts(jobId, html) {
  S.rcpt[jobId] = html;
  const box = document.getElementById('rcpt-' + jobId);
  if (box) { box.style.display = 'block'; box.innerHTML = html; }
}
async function toggleReceipts(row) {
  const jobId = row.dataset.job;
  const box = document.getElementById('rcpt-' + jobId);
  if (!box) return;
  if (S.rcpt[jobId]) { delete S.rcpt[jobId]; box.style.display = 'none'; box.innerHTML = ''; return; }
  paintReceipts(jobId, '<span class="mut">fetching receipts&hellip;</span>');
  try {
    const r = await fetch('/api/node/mac?job=' + encodeURIComponent(jobId));
    const d = await r.json();
    if (!d.receipts || !d.receipts.ok) { paintReceipts(jobId, `<span class="err">${esc((d.receipts && d.receipts.error) || 'receipts fetch failed')}</span>`); return; }
    const rc = d.receipts.receipts;
    const list = rc.receipts || [];
    paintReceipts(jobId, `<div class="mut">${esc(rc.status)} · ${rc.counts ? `${rc.counts.total} action(s), ${rc.counts.wrote} wrote, ${rc.counts.reversible} reversible` : ''} · undo: ${esc(rc.undo && rc.undo.canUndo ? 'possible' : ((rc.undo && rc.undo.reason) || 'n/a'))}</div>` +
      list.map((x) => `<div>· <b>${esc(x.type)}</b> ${esc(x.status)} <span class="mut">${x.durationMs ?? '—'} ms · effect ${esc(x.effect ?? '?')}${x.irreversibleReason ? ' · ' + esc(x.irreversibleReason) : ''}</span></div>`).join(''));
  } catch (e) {
    paintReceipts(jobId, `<span class="err">${esc(e.message)}</span>`);
  }
}

// ============================================================ data flow
function absorbSources(map) {
  for (const [k, v] of Object.entries(map || {})) {
    S.meta[k] = { key: v.key, label: v.label, family: v.family, ok: v.ok, at: v.at, ms: v.ms, error: v.error, parseError: v.parseError, unsupported: v.unsupported, version: v.version, intervalMs: v.intervalMs };
    if ('data' in v && v.data != null) S.src[k] = v.data;
  }
}
function absorbEvents(list) {
  for (const e of list || []) {
    if (e.seq <= S.maxSeq) continue;
    S.maxSeq = e.seq;
    S.events.push(e);
  }
  if (S.events.length > 300) S.events.splice(0, S.events.length - 300);
}
function applyOverview(o) {
  S.clockOffset = Date.now() - o.now;
  S.committeeAgents = o.committeeAgents || [];
  S.nodes = o.nodes; S.edges = o.edges; S.shared = o.shared;
  absorbSources(o.sources);
  absorbEvents(o.events);
  S.maxSeq = Math.max(S.maxSeq, o.eventSeq || 0);
}
function applyDelta(d) {
  S.clockOffset = Date.now() - d.t;
  S.nodes = d.nodes; S.edges = d.edges; S.shared = d.shared;
  for (const [k, m] of Object.entries(d.meta || {})) S.meta[k] = { ...(S.meta[k] || {}), ...m };
  absorbSources(d.sources);
  absorbEvents(d.events);
  const issues = computeIssues();
  renderVerdict(issues); renderAttention(issues);
  renderHeader(); renderNodes(); renderGraph(); renderShared();
  if (d.events && d.events.length) renderTicker();
}

function focus(id) {
  S.focused = id; S.detail = null; S.detailErr = null;
  savePrefs();
  renderNodes(); renderGraph(); renderDetail();
  fetchDetail();
}
async function fetchDetail() {
  const id = S.focused;
  try {
    const r = await fetch('/api/node/' + encodeURIComponent(id));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (S.focused !== id) return;
    S.detail = d; S.detailErr = null;
  } catch (e) {
    if (S.focused !== id) return;
    S.detailErr = e.message;
  }
  renderDetail();
}

let es = null;
function openSSE() {
  es = new EventSource('/api/events?cursor=' + S.maxSeq);
  es.onopen = async () => {
    const wasDropped = S.dropped;
    S.sse = 'live'; S.dropped = false;
    renderHeader();
    if (wasDropped) {
      try { applyOverview(await (await fetch('/api/overview')).json()); rerenderAll(); } catch { /* next delta will heal */ }
    }
  };
  es.onmessage = (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }
    if (d.hello) return;
    applyDelta(d);
  };
  es.onerror = () => { S.sse = 'reconnecting'; S.dropped = true; renderHeader(); };
}

function rerenderAll() {
  const issues = computeIssues();
  renderVerdict(issues); renderAttention(issues);
  renderHeader(); renderNodes(); renderGraph(); renderShared(); renderTicker(); renderDetail();
}

async function boot() {
  loadPrefs();
  let o;
  try {
    o = await (await fetch('/api/overview')).json();
  } catch (e) {
    document.body.innerHTML = `<div style="padding:40px;font-family:var(--mono)">overview fetch failed: ${esc(e.message)} — is server.mjs running?</div>`;
    return;
  }
  applyOverview(o);
  renderFilters(); renderLegend(); renderStatusLegend();
  if (S.topo) setTopo(true); else setTopo(false);
  rerenderAll();
  fetchDetail();
  openSSE();

  $('topoToggle').addEventListener('click', () => setTopo(!S.topo));
  $('sharedMore').addEventListener('click', () => { S.sharedAll = !S.sharedAll; savePrefs(); renderShared(); });
  document.addEventListener('click', (ev) => {
    const j = ev.target.closest && ev.target.closest('[data-agent]');
    if (j) focus(j.dataset.agent);
  });

  /* Feeds above a control gain rows as jobs land, so an 8 s re-render slides
   * whatever the operator was aiming at out from under the cursor. Hold the
   * refresh while the pointer is inside the panel; it catches up on exit. */
  const panel = $('nodePanel');
  panel.addEventListener('mouseenter', () => { S.hoverDetail = true; });
  panel.addEventListener('mouseleave', () => { S.hoverDetail = false; fetchDetail(); });

  setInterval(tickAges, 1000);
  setInterval(() => { if (!S.credArmed && !S.credBusy.size && !S.hoverDetail) fetchDetail(); }, 8000);
}
boot();
