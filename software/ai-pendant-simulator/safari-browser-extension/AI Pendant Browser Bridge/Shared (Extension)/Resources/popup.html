<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Pendant Browser Bridge</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="popup">
      <div class="popup-header">
        <div>
          <p class="eyebrow">AI Pendant</p>
          <h2>Browser Bridge</h2>
        </div>
        <div class="header-tools">
          <div class="status-mini" id="status-mini" title="Bridge status">
            <span id="status-dot" class="dot"></span>
            <small id="status-title">Checking…</small>
          </div>
          <!--
            WHICH BRAIN is about to be used. Separate from the bridge dot above,
            which only ever spoke for the Mac: a browser with no relay
            credential shows "Connected" there while every command silently
            leaves the machine. Routing is brain-first; this says whether that
            first choice is actually available.
          -->
          <div class="status-mini" id="brain-mini">
            <span id="brain-dot" class="dot"></span>
            <small id="brain-title">…</small>
          </div>
          <!-- Safari closes this popover on any outside click; the pin opens
               the same console as a window (or pinned tab) that stays put. -->
          <button
            id="pop-out"
            class="icon-button"
            type="button"
            title="Keep this console open in its own window"
            aria-label="Open the console in its own window"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6.5 3H3.8A1.8 1.8 0 0 0 2 4.8v7.4A1.8 1.8 0 0 0 3.8 14h7.4a1.8 1.8 0 0 0 1.8-1.8V9.5" />
              <path d="M9.5 2H14v4.5" />
              <path d="M14 2 7.5 8.5" />
            </svg>
          </button>
        </div>
      </div>

      <!--
        THE PAGE-ENGINE BANNER. Hidden while the background bridge runs the
        loops (every browser where the background evaluates). When the popup
        measures the background dead (page-engine.js backgroundAliveVerdict)
        and this document wins the engine lease, popup.js shows here WHICH
        window is carrying the bridge — and, in the transient popover, that
        pinning the console window is what keeps the brain alive.
      -->
      <p id="engine-note" class="engine-note" hidden></p>

      <!--
        SETUP LIVES HERE NOW. The owner, 2026-08-12: "having a settings page
        is lowkey kind of weird. i should be able to paste my token directly
        to the extension window and then press connect. actually, delete the
        entire settings page." One code box, one lifetime choice, one button —
        shown only while no agent token is stored, rendered by popup.js.
        The agent URL is not a field: 127.0.0.1:8000 unless a stored override
        already exists, because this popover is 400px and the URL was never
        the thing the owner typed.
      -->
      <section id="setup" class="setup" hidden>
        <p class="setup-title">Connect this browser</p>
        <input
          id="pair-code"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Pairing code (PAIRING_CODE in the repo .env)"
        />
        <div class="setup-row">
          <label class="setup-lifetime" for="pair-lifetime">
            <span>Stay connected</span>
            <!-- The four canonical lifetimes, owner's default last-forever.
                 pairing.js normalizes; the agent refuses anything else. -->
            <select id="pair-lifetime">
              <option value="session">Until this browser closes</option>
              <option value="7d">7 days</option>
              <option value="30d">30 days</option>
              <option value="forever" selected>Forever, until revoked</option>
            </select>
          </label>
          <button id="pair-connect" class="primary" type="button">Connect</button>
        </div>
        <p id="pair-notice" class="notice"></p>
        <!-- Shown ONLY in the compact "Starting the brain…" state: the way
             back to the full code box when the stored credential is the
             problem (relay says unauthorized) rather than the connection. -->
        <button id="setup-repair" class="setup-repair" type="button" hidden>
          Enter a pairing code instead
        </button>
      </section>

      <!-- The website-access grant used to live on the deleted settings page;
           the local brain cannot act in tabs without it, so the popup owns it
           now. Shown only when paired and the grant is missing. permissions
           .request must run inside the click handler (user gesture). -->
      <button id="grant-pages" class="grant-pages" type="button" hidden>
        Allow this browser’s pages
      </button>

      <!-- Approval requests other nodes put to this browser. Rendered by
           popup.js from storage; empty and hidden until one arrives. -->
      <section id="approvals" class="approvals" aria-live="polite" hidden></section>

      <form id="command-form" class="command-form">
        <div class="command-row">
          <!-- Speech lands in the box; Send is still the only thing that
               sends. Backend and availability are decided in popup.js. -->
          <button
            id="command-mic"
            class="mic-button"
            type="button"
            title="Speak a command"
            aria-label="Speak a command"
            aria-pressed="false"
          >
            <svg class="mic-glyph" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="6" y="1.8" width="4" height="7.4" rx="2" />
              <path d="M3.6 7.4a4.4 4.4 0 0 0 8.8 0" />
              <path d="M8 11.8v2.4" />
            </svg>
            <svg class="mic-stop-glyph" viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
              <rect x="4" y="4" width="8" height="8" rx="1.5" />
            </svg>
          </button>
          <input
            id="command-input"
            type="text"
            autocomplete="off"
            maxlength="2000"
            placeholder="Ask the agent anything…"
          />
          <button id="command-send" class="primary" type="submit">Send</button>
        </div>
        <label class="check-row" for="include-page">
          <input id="include-page" type="checkbox" checked />
          <span>Include this page (title and address) with the command</span>
        </label>
        <p id="command-notice" class="notice"></p>
      </form>

      <section id="history" class="history" aria-live="polite"></section>

      <!-- No Settings button: the settings page is deleted (owner, 2026-08-12)
           and everything it did that survived lives above. -->
      <div class="button-row">
        <button id="open-dashboard" type="button">Dashboard</button>
        <button id="connect-now" type="button">Connect now</button>
      </div>
      <!--
        Say what actually happens, in order, and keep it true as the order
        changes. It has been wrong twice: it once claimed every approval waited
        on the dashboard (it does not), and then that the Mac did the thinking
        (it no longer goes first). This node thinks for itself now — brain.js
        over the relay's /v1/infer — and the Mac is the fallback.
      -->
      <!--
        Written by popup.js from describeBrainState, never hard-coded. It has
        been wrong twice by being a fixed sentence about a changing system;
        the third time it claimed self-sufficiency this browser did not have.
      -->
      <p class="help" id="brain-help"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
