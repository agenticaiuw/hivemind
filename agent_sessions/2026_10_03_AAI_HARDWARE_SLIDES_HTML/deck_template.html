<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI UW Wearable Team Intro Meeting</title>
<style>
/* Theme fonts (Office "Aptos" family). Local copies in assets/fonts are used
   when the fonts are not installed system-wide. Remove them before sharing
   publicly if licensing matters; the fallback stack then applies. */
@font-face { font-family: "Aptos"; src: local("Aptos"), url("assets/fonts/Aptos.ttf"); font-weight: 400; font-style: normal; }
@font-face { font-family: "Aptos"; src: local("Aptos Bold"), local("Aptos-Bold"), url("assets/fonts/Aptos-Bold.ttf"); font-weight: 700; font-style: normal; }
@font-face { font-family: "Aptos"; src: local("Aptos Italic"), local("Aptos-Italic"), url("assets/fonts/Aptos-Italic.ttf"); font-weight: 400; font-style: italic; }
@font-face { font-family: "Aptos"; src: local("Aptos Bold Italic"), local("Aptos-BoldItalic"), url("assets/fonts/Aptos-Bold-Italic.ttf"); font-weight: 700; font-style: italic; }
@font-face { font-family: "Aptos Display"; src: local("Aptos Display"), url("assets/fonts/AptosDisplay.ttf"); font-weight: 400; }
@font-face { font-family: "Aptos Display"; src: local("Aptos Display Bold"), url("assets/fonts/AptosDisplay-Bold.ttf"); font-weight: 700; }

/* ===== Deck chrome =====================================================
   Every slide is a 1920x1080 canvas; JS scales #stage to fit the window.
   Elements are absolutely positioned in px on that canvas.
   1 pt in PowerPoint = 2 px here.                                        */
:root {
  --font-major: "{{MAJOR}}", "{{MINOR}}", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-minor: "{{MINOR}}", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --k: 0.5;
}
html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--k));
}

/* ===== Slide + element defaults ====================================== */
.slide {
  position: absolute; inset: 0; width: 1920px; height: 1080px;
  overflow: hidden; display: none;
  background: #FFFFFF; color: #000000;
  font-family: var(--font-minor);
  -webkit-font-smoothing: antialiased;
}
.slide.active { display: block; }
.slide .tx {                     /* a text box (PowerPoint shape with text) */
  position: absolute; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: flex-start;
  padding: 7.2px 14.4px;           /* PowerPoint default insets 0.05in / 0.1in */
  white-space: pre-wrap; overflow-wrap: break-word;
}
.slide .shape { position: absolute; }
.slide p { margin: 0; }
.slide .tx > p + p { margin-top: var(--gap, 0); }   /* paragraph spacing (PowerPoint spcBef) */
.slide .mj { font-family: var(--font-major); }          /* theme heading font */
.slide .pic { position: absolute; display: block; }
.slide .crop { overflow: hidden; }
.slide .crop img { position: absolute; display: block; max-width: none; }
.slide a.media { cursor: pointer; }

/* bullets: hanging indent = --hang, text starts at padding-left */
.slide .bu, .slide .num { padding-left: 36px; text-indent: -36px; }   /* master level-1 hang */
.slide .bu::before, .slide .num::before {
  display: inline-block; width: var(--hang, 36px); text-indent: 0;
}
.slide .bu::before { content: "\2022"; font-family: Arial, sans-serif; }
.slide .bu[data-bu]::before { content: attr(data-bu); }
.slide .num::before { content: attr(data-n) "."; }
.slide .num-mj::before { font-family: var(--font-major); }

/* ===== HUD (hidden in print) ========================================== */
.hud {
  position: fixed; right: 14px; bottom: 12px; z-index: 10;
  font: 13px/1 -apple-system, "Segoe UI", sans-serif; color: #ddd;
  background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px;
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.hud.show, body.editing .hud { opacity: 1; }
body.editing .slide .tx { outline: 1px dashed rgba(21,96,130,.55); cursor: text; }
body.editing #stage { cursor: default; }

/* ===== Print: Cmd+P -> one slide per 16:9 page ======================== */
@media print {
  @page { size: 13.333in 7.5in; margin: 0; }
  html, body { height: auto; overflow: visible; background: #fff; }
  #stage { position: static; transform: none; width: auto; height: auto; }
  .slide {
    display: block !important; position: relative; zoom: 0.666667;
    break-after: page; page-break-after: always;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  .hud { display: none; }
  body.editing .slide .tx { outline: none; }
}
</style>
</head>
<body>
<div id="stage">

{{SLIDES}}

</div>
<div class="hud" id="hud"></div>
<script>
/* Navigation: arrows / space / click, F fullscreen, E edit mode, #N deep links.
   In edit mode: click a text box to type; Cmd/Ctrl+S downloads the edited deck. */
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var stage = document.getElementById('stage'), hud = document.getElementById('hud');
  var cur = 0, editing = false, hudTimer;

  function fit() {
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.documentElement.style.setProperty('--k', k);
  }
  function showHud(msg) {
    hud.textContent = msg || ((cur + 1) + ' / ' + slides.length);
    hud.classList.add('show');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(function () { hud.classList.remove('show'); }, 1500);
  }
  function go(i, fromHash, quiet) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides[cur].classList.remove('active');
    cur = i;
    slides[cur].classList.add('active');
    if (!fromHash) history.replaceState(null, '', '#' + (cur + 1));
    if (quiet) return;
    if (!editing) showHud(); else hud.textContent = 'Editing ' + (cur + 1) + ' / ' + slides.length + ' — E/Esc to finish, ⌘S to save';
  }
  function fromHash() {
    var n = parseInt(location.hash.replace('#', '').replace(/^s/, ''), 10);
    return isNaN(n) ? 0 : n - 1;
  }
  function setEditing(on) {
    editing = on;
    document.body.classList.toggle('editing', on);
    document.querySelectorAll('.slide .tx').forEach(function (el) {
      if (on) el.setAttribute('contenteditable', 'true'); else el.removeAttribute('contenteditable');
    });
    if (!on && document.activeElement) document.activeElement.blur();
    go(cur, true);
  }
  function save() {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('body').classList.remove('editing');
    clone.querySelectorAll('[contenteditable]').forEach(function (el) { el.removeAttribute('contenteditable'); });
    clone.querySelectorAll('.slide.active').forEach(function (el) { el.classList.remove('active'); });
    clone.querySelector('.slide').classList.add('active');
    clone.style.removeProperty('--k');
    if (!clone.getAttribute('style')) clone.removeAttribute('style');
    clone.querySelector('#hud').textContent = '';
    var blob = new Blob(['<!doctype html>\n' + clone.outerHTML], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'deck.html'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  document.addEventListener('keydown', function (e) {
    var inText = e.target && e.target.isContentEditable;
    if (editing && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
    if (e.key === 'Escape' && editing) { setEditing(false); return; }
    if (inText || e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': case 'Enter':
        e.preventDefault(); go(cur + 1); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace':
        e.preventDefault(); go(cur - 1); break;
      case 'Home': go(0); break;
      case 'End': go(slides.length - 1); break;
      case 'f': case 'F':
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        break;
      case 'e': case 'E': setEditing(!editing); break;
    }
  });
  stage.addEventListener('click', function (e) {
    if (editing || e.target.closest('a')) return;
    var rect = stage.getBoundingClientRect();
    go(e.clientX < rect.left + rect.width * 0.25 ? cur - 1 : cur + 1);
  });
  window.addEventListener('hashchange', function () { go(fromHash(), true); });
  window.addEventListener('resize', fit);
  fit();
  slides.forEach(function (s) { s.classList.remove('active'); });
  go(fromHash(), true, true);
})();
</script>
</body>
</html>
