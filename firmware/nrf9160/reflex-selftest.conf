# Reflex-layer hardware verification overlay (same species as
# harness-inject.conf): stack on top of the normal build with
#   -DEXTRA_CONF_FILE="<...>/secrets.conf;<...>/reflex-selftest.conf"
#
# Installs a RAM-only armed 10 s countdown recipe at boot when the card has
# no recipes.json (LED burst + haptic double + chime), so the whole reflex
# path — trigger tick, haptic probe/degrade, I2S chime — proves itself from
# the serial log with nothing on the card.  See CONFIG_PENDANT_REFLEX_SELFTEST.
CONFIG_PENDANT_REFLEX_SELFTEST=y
