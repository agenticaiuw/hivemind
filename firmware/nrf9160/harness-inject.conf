# Harness-only overlay: digital mic injection over SWD.
#
# Layer this on top of prj.conf when you need a reproducible end-to-end run.
# It replaces the physical microphone with PCM a debugger streams into RAM, so
# the utterance under test is byte-identical between runs at a known level —
# neither of which is true when the test rig plays speech out of a laptop
# speaker at the pendant.
#
#   west build -b nrf9160dk/nrf9160/ns -d <build> <app> -- \
#     -DEXTRA_CONF_FILE="<app>/secrets.conf;<app>/harness-inject.conf"
#
# Never layer this into a production image: see firmware/nrf9160/Kconfig.
CONFIG_PENDANT_MIC_INJECT=y
