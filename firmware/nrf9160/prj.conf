CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=4
CONFIG_I2S_NRFX_RX_BLOCK_COUNT=6
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FS_FATFS_EXTRA_NATIVE_API=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# nRF9160 LTE and native TLS socket support.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
# Default 600s leaves LED solid for up to 10 minutes (lte_lc_connect). 120s is
# enough for a real attach and fails clearly when SIM/signal is bad.
CONFIG_LTE_NETWORK_TIMEOUT=120
CONFIG_NRF_MODEM_LIB=y
CONFIG_MODEM_KEY_MGMT=y
# Opus uses a static NONTHREADSAFE_PSEUDOSTACK scratch (see CMakeLists), not
# malloc. Keep a small system heap for modem/socket leftovers only.
CONFIG_HEAP_MEM_POOL_SIZE=2048
#
# Live Opus uses NONTHREADSAFE_PSEUDOSTACK: SILK temps live in a 28 KiB static
# buffer (audio_opus.c), not on the main thread stack. Measured voiced peak
# under VAR_ARRAYS was ~25.4 KiB; 20 KiB main is enough for capture+shallow
# encode frames once scratch is off-stack. Keep HW stack guard + INIT_STACKS.
CONFIG_MAIN_STACK_SIZE=20480
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_HWINFO=y

# nRF91 modem applications execute as the non-secure image beside TF-M.
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
