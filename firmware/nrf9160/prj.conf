CONFIG_GPIO=y
CONFIG_I2C=y
# Volume knob on SAADC AIN2/P0.15 (ratiometric VDD/4 reference; see
# volume_poll in main.c). One-shot polled reads only, no async, no stream.
CONFIG_ADC=y
CONFIG_I2S=y
# TX queue depth is a hard real-time budget, not a convenience: i2s_nrfx
# errors the ENTIRE duplex transfer (RX included) if the next TX buffer is
# missing one block after it asks. 8 queued + 2 latched = ~205 ms runway.
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=8
CONFIG_I2S_NRFX_RX_BLOCK_COUNT=6
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# nRF9160 LTE and native TLS socket support.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
# Every socket is modem-offloaded; the native IP stack only burned RAM
# (net_pkt pools, RX thread) without ever seeing a packet.
CONFIG_NET_NATIVE=n
CONFIG_POSIX_API=y

# Full-duplex conversation transport: WebSocket over the offloaded TLS
# socket. The handshake hashes with SHA-1, which only the HTTP *server*
# Kconfig selects — request it explicitly or connect fails with -EPROTO.
CONFIG_WEBSOCKET_CLIENT=y
CONFIG_HTTP_CLIENT=y
CONFIG_PSA_WANT_ALG_SHA_1=y
# POSIX_API force-selects timers; nothing here uses them, so shrink the
# pool from 32 slots (4 KiB) to the minimum.
CONFIG_POSIX_TIMER_MAX=4
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
# Default 600s leaves LED solid for up to 10 minutes (lte_lc_connect). 120s is
# enough for a real attach and fails clearly when SIM/signal is bad.
CONFIG_LTE_NETWORK_TIMEOUT=120
CONFIG_NRF_MODEM_LIB=y
CONFIG_MODEM_KEY_MGMT=y
# Opus uses a static NONTHREADSAFE_PSEUDOSTACK scratch (see CMakeLists), not
# malloc. websocket_send_msg k_mallocs each masked frame (≤ ~640 B here),
# so the heap carries WS frames + modem/socket leftovers.
CONFIG_HEAP_MEM_POOL_SIZE=3072
#
# Live Opus uses NONTHREADSAFE_PSEUDOSTACK: SILK temps live in a 28 KiB static
# buffer (audio_opus.c), not on the main thread stack. Measured on-hardware
# main-stack peak across full capture+encode+upload cycles: 5,792 B — 10 KiB
# keeps ~1.7x margin and funds the duplex buffers. Guard + INIT_STACKS stay.
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_EXTRA_EXCEPTION_INFO=y
# Minimal logging (printk-backed, no buffers or threads) so driver-level
# failures name themselves — i2s_nrfx distinguishes a TX underrun ("Next
# buffers not supplied on time") from an RX overrun ("No room in RX
# queue"), and guessing between them costs a flash cycle each time.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# nRF91 modem applications execute as the non-secure image beside TF-M.
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
