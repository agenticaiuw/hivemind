# nRF9160 LTE and native TLS socket support.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
# libopus is built with -DVAR_ARRAYS, so every ALLOC() inside the codec is a
# C99 VLA on the *calling* thread's stack, and pendant_opus_encode_file() runs
# on the main thread.  GCC's -fstack-usage prints "10752 dynamic" for
# silk_encode_frame_FIX; the bare "dynamic" qualifier means VLAs are excluded
# from that number, so the old 24576 budget derived from it was wrong and the
# board took a PSPLIM UsageFault inside silk_pitch_analysis_core.  The real
# encode high-water mark, read off the board with CONFIG_INIT_STACKS and a
# strongly voiced input (PENDANT_BOOT_ENCODE_SELFTEST in src/main.c), is
# 25396 bytes - 820 bytes past the old 24576 budget, which is exactly the
# observed failure.  32768 leaves 7372 bytes (29% of peak) of headroom.
#
# Measure with a VOICED signal or the number lies: the two 1920-byte stage-3
# VLAs in silk_pitch_analysis_core sit behind the "pitch candidate found"
# branch, so a silent capture peaks at only ~23.4 KiB and would have fit in
# the old, broken budget.
#
# CONFIG_INIT_STACKS lets main() report its own high-water mark after every
# encode (see report_main_stack_headroom() in src/main.c); it costs no RAM,
# only a boot-time 0xAA fill.  Keep CONFIG_BUILTIN_STACK_GUARD (default via
# CONFIG_HW_STACK_PROTECTION) so any future overflow still faults precisely.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_EXTRA_EXCEPTION_INFO=y

# nRF91 modem applications execute as the non-secure image beside TF-M.
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
