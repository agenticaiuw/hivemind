CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=16
CONFIG_I2S_NRFX_RX_BLOCK_COUNT=16
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# nRF9160 LTE and native TLS socket support.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
# Fixed-point SILK encoding has a measured ~10.8 KiB peak frame function;
# allow for its callers and the file/Ogg wrapper on the same main thread.
CONFIG_MAIN_STACK_SIZE=24576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# nRF91 modem applications execute as the non-secure image beside TF-M.
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
