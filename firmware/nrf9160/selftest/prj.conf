# Bench self-test: drivers for the wires under test, and nothing else.
#
# No LTE, no modem library, no networking, no Opus, no WebSocket. Those are
# the pendant app's job; here they would only add ways for a wiring question
# to fail for a non-wiring reason (and they are what makes the app build slow
# and RAM-tight). Everything below maps to a physical net on the breadboard.

# NOTE ON THE MODEM LIBRARY. It is left at the board default (enabled) even
# though this app never brings up LTE. Turning it off, together with dropping
# the modem's shared-memory nodes from the overlay, is what this app tried
# first — and the result was a non-secure lockup at boot. The application
# image boots reliably with the library present, so this app keeps the same
# arrangement and simply never calls it. "Never started" is what matters for a
# wiring test; "not linked" was not worth a dead board.

# RANDOMNESS — matched to the application, and this is a boot-critical setting.
#
# Something in the filesystem/disk stack pulls in the random subsystem. Left to
# its own devices this app picked PSA_CSPRNG_GENERATOR, which routes every
# request through a non-secure call into TF-M's crypto partition — and that
# partition was built WITHOUT its hash module here, because nothing else asked
# for one. The result was a fault inside the secure image (PC=0x240A, IPSR=7)
# that looked exactly like a dead board: TF-M trapped it, spun with interrupts
# masked, and the console never emitted a byte.
#
# The application uses the hardware entropy driver instead and boots. These two
# lines are that same arrangement, and they are the difference between an app
# that answers questions about wires and one that answers nothing at all.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TFM_CRYPTO_HASH_MODULE_ENABLED=y

# Buttons P0.21-23, encoder P0.24/25, mic-power sense P0.26, amp SD_MODE P0.01
CONFIG_GPIO=y

# I2C2 on P0.30/31 — the DRV2605L haptic driver at 0x5A
CONFIG_I2C=y

# Volume pot wiper on SAADC AIN2 / P0.15
CONFIG_ADC=y

# SPH0645 microphone on the I2S bus (slave RX; clocks come from PWM1/PWM2
# driven through the raw nrfx HAL exactly as the pendant app drives them)
CONFIG_I2S=y
CONFIG_I2S_NRFX_RX_BLOCK_COUNT=6

# microSD breakout on the Arduino SPI header, P0.10-13
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Never reformat the owner's card to make a test pass. A card that will not
# mount is a result, not a problem to paper over.
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FILE_SYSTEM_MKFS=n

# Console on uart0 (TX-only, P0.29 -> DK VCOM0) and the ESP32 command link
# on uart1 (P0.00 TX / P0.05 RX).
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
# Interrupt-driven RX on uart1: poll_in restarts a one-byte reception per
# call, so a polled reader drops whatever lands between two polls — which
# would turn "the ESP32 answered" into "the ESP32 did not answer".
CONFIG_UART_INTERRUPT_DRIVEN=y

# The I2S RX block copy (2,560 B) plus the report buffers live on the main
# stack. The pendant app needs 10 KiB for Opus; this needs far less.
CONFIG_MAIN_STACK_SIZE=8192

# Driver-level failures should name themselves: sdmmc distinguishes "no card"
# from "card error on CMD0", and i2s_nrfx distinguishes an RX overrun from a
# missing clock. Guessing between those costs a flash cycle each time.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Non-secure image beside TF-M, same as the application.
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
