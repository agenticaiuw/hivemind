[platformio]
default_envs = featheresp32

[env:featheresp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = featheresp32
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  # Module parity: a BM83-class module does not dump its internal library
  # chatter onto its own command UART. Errors only — this is also a live
  # reliability fix, not just tidiness: ESP_LOGx and this file's own
  # emitLine() both ultimately write the console UART (UART0/USB, the same
  # peripheral as Serial), and at level 3 the volume of unrelated log lines
  # made an interleaved/spliced JSON line something observed on the bench,
  # not merely theoretical. See the serialLock comment in main.cpp for the
  # matching fix on this file's own two writer tasks.
  -DCORE_DEBUG_LEVEL=1
